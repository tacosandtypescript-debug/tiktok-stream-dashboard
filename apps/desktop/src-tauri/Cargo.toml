[package]
name = "tiktok-stream-dashboard"
version = "0.4.2"
description = "Panel de control ligero para TikTok LIVE con overlays para OBS"
authors = ["Isaac"]
edition = "2021"
publish = false

[lib]
name = "dashboard"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Escritorio -------------------------------------------------------------
# Opcional: el nucleo (bus, providers, chat, base de datos) se compila y se
# testea sin Tauri, lo que hace los tests de CI mucho mas rapidos.
tauri = { version = "2", features = [], optional = true }

# --- Runtime asincrono ------------------------------------------------------
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "signal", "fs"] }
futures-util = "0.3"

# --- Servidor de overlays para OBS ------------------------------------------
# El plan (docs/plan-review.md §29) fija Axum + WebSocket para los Browser Source
# de OBS. `ws` trae el WebSocket; no se activan mas features porque aqui no se
# sirve nada mas que el handshake.
axum = { version = "0.8", features = ["ws"] }

# --- Provider TikTok nativo (validado en el spike) --------------------------
# rustls en TODO: no usamos schannel/native-tls (ver docs/decisions.md D6).
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
prost = "0.13"
flate2 = "1"
base64 = "0.22"
rand = "0.8"

# --- Tipos y errores --------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"

# --- Observabilidad ---------------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# --- Persistencia -----------------------------------------------------------
# `bundled` compila SQLite desde fuente: no dependemos del SQLite del sistema.
rusqlite = { version = "0.32", features = ["bundled"] }

# --- Audio (TTS) ------------------------------------------------------------
# Un unico flujo de salida persistente: nada de lanzar un reproductor por frase.
rodio = "0.20"

[features]
# Por defecto se compila todo, **incluida la interfaz embebida**, para que
# `cargo build --release` produzca directamente una aplicacion ejecutable.
#
# `custom-protocol` es la feature que hace que Tauri sirva los recursos
# empaquetados en lugar de `devUrl`. Sin ella, Tauri se comporta como en
# desarrollo y la ventana intenta cargar http://localhost:1420: si el servidor
# de Vite no esta levantado, aparece ERR_CONNECTION_REFUSED.
default = ["desktop", "custom-protocol"]
desktop = ["tauri"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
