            radioMax: Number(Math.max(...lista.map((p) => p.radio)).toFixed(1)),
            solapeMax: Number(solape.toFixed(2)),
            energiaMedia: Number(media(lista.map((p) => p.energia?.valor ?? 0)).toFixed(1)),
            anguloMax: Number(Math.max(0, ...lista.map((p) => Math.abs(p.angulo ?? 0))).toFixed(3)),
            giroMax: Number(Math.max(0, ...lista.map((p) => Math.abs(p.velocidadAngular ?? 0))).toFixed(2)),
            squashMax: Number(Math.max(0, ...lista.map((p) => Math.abs(p.squash?.valor ?? 0))).toFixed(3)),
            radioVelMax: Number(Math.max(0, ...lista.map((p) => Math.abs(p.velocidadRadio ?? 0))).toFixed(1)),
            chispas: lista.reduce((n, p) => n + p.ritmo.chispas.length, 0),
            ondas: ondas.length,
            /**
             * Posicion y radio de cada una, para poder recortar y ampliar desde
             * fuera. La sonda del navegador lo usa para mirar de cerca la pelota
             * mas pequena: el tamano minimo legible no se juzga con un numero.
             */
            lista: lista.map((p) => ({
              puesto: p.puesto,
              r: Number(p.radio.toFixed(1)),
              x: Math.round(p.x),
              y: Math.round(p.y),
              etiqueta: p.radio >= RADIO_ETIQUETA,
            })),
            /** Cuantas estan en racha o empujadas: tiene que volver a 0 solo. */
            empujadas: lista.filter((p) => p.ritmo.empujonHasta > ahora || p.empujadoHasta > ahora).length,
            problemas,
          };
        };

        // --- Paso de simulacion ----------------------------------------------

        /**
         * Un paso de fisica, en orden.
         *
         * El orden no es decorativo: primero los taps (que dan energia), despues el
         * tamano (que cambia la masa), luego las fuerzas, luego el movimiento, y al
         * final los choques, los topes y las paredes, que corrigen lo que el
         * movimiento dejo mal. Los muelles de **dibujo** (giro y deformacion) van al
         * final, porque no afectan a la fisica y no deben poder romperla.
         *
         *   1. tamano (muelle del radio)
         *   2. energia y fuerzas (sacudida, nado, ondas, fuerzas globales)
         *   3. movimiento
         *   4. paredes
         *   5. control de velocidad de crucero
         *   6. choques pelota-pelota
         *   7. recorte de posicion y tope de velocidad
         *   8. atascos, trayectorias, giro, deformacion y particulas
         */
        function paso(dt) {
          const lista = [];

          for (const [clave, p] of pelotas) {
            // Entrada y salida animadas. La escala corre tambien con el movimiento
            // reducido: es lo unico que explica que una pelota cambie de tamano
            // cuando alguien toca. Exponencial y no `dt * 6` para que la entrada
            // dure lo mismo a 30 que a 144 fps.
            p.escala += ((p.morir > 0 ? 0 : 1) - p.escala) * (1 - Math.exp(-6 * dt));
            if (p.morir > 0 && ahora - p.morir > 420) {
              pelotas.delete(clave);
              continue;
            }
            lista.push(p);

            // --- 1. Energia y tamano ---
            actualizarEnergia(p, dt);
            actualizarRadio(p, dt);

            if (reducido) continue; // sin movimiento: solo tamanos

            // --- 2. Fuerzas ---
            sacudir(p, dt);
            nadar(p, dt);
            empujarGlobal(p, dt);

            // --- 3. Movimiento ---
            p.x += p.vx * dt;
            p.y += p.vy * dt;

            // --- 4. Paredes ---
            rebotarEnBordes(p);
            actualizarRastro(p);

            // --- 5. Crucero ---
            ajustarVelocidad(p, dt);
          }

          if (reducido) return;

          // --- 6. Ondas de choque: empujan a las vecinas antes de los choques,
          // para que el empujon de la onda y el del golpe se resuelvan en el mismo
          // fotograma y no se pisen.
          aplicarOndas(dt);

          // --- 7. Choques y paredes, alternos ---
          //
          // Tres pasadas de choques, y despues de cada una el recorte contra las
          // paredes: el recorte puede meter una pelota dentro de otra (una pequena
          // entre el nº1 y el suelo), y entonces hay que volver a separarlas. Con
          // una sola vuelta al final se quedaban pegadas.
          for (let vuelta = 0; vuelta < 3; vuelta++) {
            for (let i = 0; i < lista.length; i++) {
              for (let j = i + 1; j < lista.length; j++) chocar(lista[i], lista[j]);
            }
            recortarEnZona(lista);
          }

          // --- 8. Tope de velocidad, ya con todo colocado ---
          //
          // Los choques acaban de meter impulso y sin esto sobrevivia un fotograma
          // entero por encima de `maxima`. Es media docena de `hypot` por fotograma.
          for (const p of lista) {
            if (p.morir > 0) continue;
            limitarVelocidad(p);
          }

          // --- 9. Lo que ya no mueve la fisica ---
          for (const p of lista) {
            if (p.morir > 0) continue;
            desatascar(p);
            romperTrayectoria(p);
            actualizarRotacion(p, dt);
            actualizarSquash(p, dt);
            avanzarChispas(p, dt);
          }
        }

        // --- Pintado ---------------------------------------------------------

        /**
         * Una pelota: rastro, foto recortada, aro, corona, efectos y etiqueta.
         *
         * Todo lo que entra en `ctx.arc` esta acotado. La animacion de entrada
         * lleva la escala a 0, el radio baja a ~3 px y `r - 4` salia NEGATIVO:
         * `ctx.arc` lanzaba `IndexSizeError: radius -0.994 is negative` dentro del
         * bucle, el `requestAnimationFrame` no se volvia a registrar y el overlay
         * se quedaba congelado del todo, sin ningun sintoma en OBS. Fue un fallo
         * real, medido, y no puede volver.
         */
        function pintarPelota(p) {
          const r = Math.max(2, p.radio * p.escala);
          const rAro = Math.max(1, r - 4);
          const esLider = p.puesto === 0;

          // Rastro de la rafaga: una estela que se apaga hacia atras.
          if (p.rastro.length > 1) {
            pincel.lineCap = "round";
            pincel.strokeStyle = esLider ? LIDER : ACENTO;
            for (let i = 1; i < p.rastro.length; i++) {
              const a = p.rastro[i - 1];
              const b = p.rastro[i];
              const t = i / p.rastro.length;
              pincel.beginPath();
              pincel.moveTo(a.x, a.y);
              pincel.lineTo(b.x, b.y);
              pincel.lineWidth = Math.max(1, r * 1.5 * t);
              pincel.globalAlpha = t * 0.22;
              pincel.stroke();
            }
            pincel.globalAlpha = 1;
          }

          // Profundidad: las pequenas un poco apagadas, para que la composicion
          // tenga fondo y el lider resalte.
          pincel.globalAlpha = esLider ? 1 : 0.62 + 0.38 * (r / RADIO_MAX);

          pincel.save();
          aplicarDeformacion(p);
          pincel.beginPath();
          pincel.arc(p.x, p.y, r, 0, Math.PI * 2);
          pincel.closePath();
          pincel.clip();
          const foto = p.foto;
          if (foto && foto.complete && foto.naturalWidth > 0) {
            pincel.drawImage(foto, p.x - r, p.y - r, r * 2, r * 2);
          } else {
            // Respaldo: la inicial sobre el color del puesto. Nunca el hueco de
            // otra persona. A 2 px de radio no se lee nada, asi que la letra solo
            // se pinta cuando hay sitio para ella.
            pincel.fillStyle = esLider ? LIDER : CARA_SIN_FOTO;
            pincel.fillRect(p.x - r, p.y - r, r * 2, r * 2);
            if (r >= 20) {
              pincel.fillStyle = esLider ? TINTA_LIDER : TEXTO;
              pincel.font = `700 ${Math.round(r * 0.7)}px "Segoe UI", system-ui, sans-serif`;
              pincel.textAlign = "center";
              pincel.textBaseline = "middle";
              pincel.fillText(p.inicial, p.x, p.y);
            }
          }
          pincel.restore();

          // El aro, tambien deformado: es lo que hace que el aplastamiento se lea
          // como una pelota que se chafa y no como una foto recortada.
          pincel.save();
          aplicarDeformacion(p);
          pincel.beginPath();
          pincel.arc(p.x, p.y, rAro, 0, Math.PI * 2);
          pincel.lineWidth = esLider ? 14 : 8;
          pincel.strokeStyle = esLider ? LIDER : ACENTO;
          pincel.stroke();
          pincel.restore();

          // La corona del nº1, como en los otros disenos. **Sin deformar**: es una
          // insignia, y una corona aplastada y ladeada se lee como un error.
          if (esLider && r > 40) {
            pincel.font = `${Math.round(r * 0.52)}px "Segoe UI Emoji", serif`;
            pincel.textAlign = "center";
            pincel.textBaseline = "alphabetic";
            pincel.fillText("👑", p.x, p.y - r + Math.round(r * 0.1));
          }

          pincel.globalAlpha = 1;
          pintarEfectos(p, r);

          // Etiqueta: solo en las pelotas que se leen, y solo si no pisa otra ya
          // pintada (antes dos cajas juntas se solapaban y no se leia ninguna).
          // Lleva caja propia porque va sobre video.
          if (r >= RADIO_ETIQUETA) pintarEtiqueta(p, r, esLider);
        }

        function pintarEtiqueta(p, r, esLider) {
          const etiqueta = `${p.nombre} · ${numero(p.valor)}`;
          const tamano = Math.max(22, Math.min(56, r * 0.34));
          pincel.font = `700 ${tamano}px "Segoe UI", system-ui, sans-serif`;
          const anchoTexto = pincel.measureText(etiqueta).width;
          const altoCaja = tamano + 14;
          const relleno = 14;
          // El ancho de la caja se acota al lienzo: con un apodo largo la caja
          // salia por los lados y la mitad del nombre se veia fuera.
          const medio = Math.min(anchoTexto / 2 + relleno, ZONA_ANCHO / 2 - 8);
          const centroX = Math.min(Math.max(medio, p.x), ZONA_ANCHO - medio);
          const x0 = centroX - medio;
          const cajaY = Math.min(p.y + r - altoCaja * 0.7, ALTO - altoCaja - 6);
          const caja = { x0, x1: x0 + medio * 2, y0: cajaY, y1: cajaY + altoCaja };

          if (etiquetasPintadas.some((otra) => seSolapan(caja, otra))) return;
          etiquetasPintadas.push(caja);

          pincel.fillStyle = esLider ? "rgba(255,46,99,0.92)" : "rgba(8,10,14,0.78)";
          const radioCaja = altoCaja / 2;
          const x1 = x0 + medio * 2;
          const y1 = cajaY + altoCaja;
          pincel.beginPath();
          pincel.moveTo(x0 + radioCaja, cajaY);
          pincel.arcTo(x1, cajaY, x1, y1, radioCaja);
          pincel.arcTo(x1, y1, x0, y1, radioCaja);
          pincel.arcTo(x0, y1, x0, cajaY, radioCaja);
          pincel.arcTo(x0, cajaY, x1, cajaY, radioCaja);
          pincel.closePath();
          pincel.fill();

          pincel.fillStyle = esLider ? TINTA_LIDER : "#f2f4f8";
          pincel.textAlign = "center";
          pincel.textBaseline = "middle";
          pincel.fillText(etiqueta, centroX, cajaY + altoCaja / 2);
        }

        function pintarEfectos(p, r) {
          const rit = p.ritmo;
          if (reducido) return;

          for (const c of rit.chispas) {
            // La chispa se descarta al pasar por cero, pero puede dibujarse con
            // la `vida` ya negativa: `tam * vida` daba un radio NEGATIVO y
            // `ctx.arc` lanzaba IndexSizeError. El radio se acota y las apagadas
            // se saltan.
            if (c.vida <= 0) continue;
            pincel.globalAlpha = c.vida * 0.9;
            pincel.fillStyle = p.puesto === 0 ? LIDER : ACENTO;
            pincel.beginPath();
            pincel.arc(c.x, c.y, Math.max(0.5, c.tam * c.vida), 0, Math.PI * 2);
            pincel.fill();
          }
          pincel.globalAlpha = 1;

          const desde = ahora - rit.pulso;
          if (rit.pulso > 0 && desde >= 0 && desde < 620) {
            const t = desde / 620;
            // El aro crece con la energia: el mismo tap no puede sonar igual con la
            // pelota fria que con la pelota cargada de una racha.
            const hinchazon = 0.7 + 0.7 * ((p.energia?.valor ?? 0) / ENERGIA_MAX);
            pincel.beginPath();
            pincel.arc(p.x, p.y, r + t * 46 * hinchazon, 0, Math.PI * 2);
            pincel.lineWidth = 10 * (1 - t) + 2;
            pincel.strokeStyle = p.puesto === 0 ? LIDER : ACENTO;
            pincel.globalAlpha = (1 - t) * 0.9;
            pincel.stroke();
            pincel.globalAlpha = 1;
          }

          if (ahora < rit.empujonHasta) {
            const latido = 0.5 + 0.5 * Math.sin(ahora / 85);
            pincel.beginPath();
            pincel.arc(p.x, p.y, Math.max(1, r - 2), 0, Math.PI * 2);
            pincel.lineWidth = 10;
            pincel.strokeStyle = p.puesto === 0 ? LIDER : ACENTO;
            pincel.globalAlpha = 0.4 + 0.6 * latido;
            pincel.stroke();

            // Aro blanco por fuera: es lo que hace que el parpadeo se note sobre
            // cualquier fondo.
            pincel.beginPath();
            pincel.arc(p.x, p.y, r + 7, 0, Math.PI * 2);
            pincel.lineWidth = 5;
            pincel.strokeStyle = BLANCO;
            pincel.globalAlpha = 0.25 + 0.55 * latido;
            pincel.stroke();
            pincel.globalAlpha = 1;
          }
        }

        /**
         * La capa de depuracion. Solo se llama con `?fisica=1`; con la constante en
         * `false` no se dibuja absolutamente nada de mas.
         *
         * Enseña lo que no se ve: el **circulo de colision** (el radio fisico, que
         * el squash no toca), el centro, el vector de velocidad y la ficha de cada
         * pelota con velocidad, objetivo, masa y energia. Es lo que distingue "se ve
         * raro" de "esta mal": un solape, un tope pasado o una energia disparada se
         * leen aqui en un fotograma.
         */
        function pintarDebug(lista) {
          pincel.save();

          // La franja de juego, el borde por el que rebotan y el centro al que
          // tiende el nº1.
          pincel.setLineDash([14, 10]);
          pincel.lineWidth = 2;
          pincel.strokeStyle = "rgba(37, 244, 238, 0.5)";
          pincel.strokeRect(2, ZONA_Y + 2, ZONA_ANCHO - 4, ZONA_ALTO - 4);
          pincel.setLineDash([]);
          pincel.beginPath();
          pincel.moveTo(ZONA_ANCHO / 2 - 12, ZONA_Y + ZONA_ALTO / 2);
          pincel.lineTo(ZONA_ANCHO / 2 + 12, ZONA_Y + ZONA_ALTO / 2);
          pincel.moveTo(ZONA_ANCHO / 2, ZONA_Y + ZONA_ALTO / 2 - 12);
          pincel.lineTo(ZONA_ANCHO / 2, ZONA_Y + ZONA_ALTO / 2 + 12);
          pincel.stroke();

          pincel.font = '600 20px "Consolas", monospace';
          pincel.textAlign = "left";
          pincel.textBaseline = "middle";

          for (const p of lista) {
            const v = Math.hypot(p.vx, p.vy);

            // Circulo de colision: el radio de verdad, sin squash ni escala.
            pincel.beginPath();
            pincel.arc(p.x, p.y, p.radio, 0, Math.PI * 2);
            pincel.lineWidth = 2;
            pincel.strokeStyle = p.tiburon ? "rgba(255,46,99,0.9)" : "rgba(37,244,238,0.75)";
            pincel.stroke();

            // Centro y vector de velocidad, con la punta.
            pincel.fillStyle = BLANCO;
            pincel.beginPath();
            pincel.arc(p.x, p.y, 3, 0, Math.PI * 2);
            pincel.fill();

            const escalaV = 0.22;
            const fx = p.x + p.vx * escalaV;
            const fy = p.y + p.vy * escalaV;
            pincel.beginPath();
            pincel.moveTo(p.x, p.y);
            pincel.lineTo(fx, fy);
            pincel.lineWidth = 3;
            pincel.strokeStyle = "rgba(245,196,81,0.95)";
            pincel.stroke();
            pincel.beginPath();
            pincel.arc(fx, fy, 5, 0, Math.PI * 2);
            pincel.fillStyle = "rgba(245,196,81,0.95)";
            pincel.fill();

            // El numero del puesto, para poder cruzar la tabla con el lienzo.
            pincel.fillStyle = BLANCO;
            pincel.font = '700 22px "Consolas", monospace';
            pincel.textAlign = "center";
            pincel.fillText(String(p.puesto), p.x, p.y - p.radio - 10);
            pincel.textAlign = "left";
            void v;
          }

          // La tabla: una linea por pelota, **fuera** de las bolas. Las fichas
          // pegadas a cada una se tapaban entre ellas y no se leia ninguna.
          const filas = lista.map((p) => {
            const { crucero, maxima } = limitesDe(p);
            return [
              String(p.puesto).padStart(2),
              `${Math.hypot(p.vx, p.vy).toFixed(0).padStart(4)}/${crucero.toFixed(0).padStart(3)}`,
              `tope ${maxima.toFixed(0).padStart(4)}`,
              `m ${masaDe(p, ahora).toFixed(0).padStart(4)}`,
              `r ${p.radio.toFixed(0).padStart(3)}>${p.radioObjetivo.toFixed(0).padStart(3)}`,
              `e ${(p.energia?.valor ?? 0).toFixed(1).padStart(4)}`,
              `g ${(p.angulo ?? 0).toFixed(2).padStart(5)}`,
              `s ${(p.squash?.valor ?? 0).toFixed(2).padStart(5)}`,
            ].join(" ");
          });
          const resumen = [
            SIMULAR_FISICA ? `sim ${escenarioSim().id} · ${lista.length} pelotas` : `directo · ${lista.length} pelotas`,
            `${metricas.fps.toFixed(1)} fps · ${metricas.msMedio.toFixed(2)} ms/f · peor ${metricas.msPeor.toFixed(1)}`,
            `v medio ${media(lista.map((q) => Math.hypot(q.vx, q.vy))).toFixed(0)} px/s`,
            `chispas ${lista.reduce((n, q) => n + q.ritmo.chispas.length, 0)} · ondas ${ondas.length}`,
            `solape max ${solapeMaximo(lista).toFixed(1)} px`,
          ];
          const ancho = 470;
          const alto = (resumen.length + filas.length) * 20 + 14;
          pincel.fillStyle = "rgba(8,10,14,0.8)";
          pincel.fillRect(6, ZONA_Y + 6, ancho, alto);
          pincel.font = '700 17px "Consolas", monospace';
          pincel.fillStyle = ACENTO;
          resumen.forEach((texto, i) => pincel.fillText(texto, 16, ZONA_Y + 22 + i * 20));
          pincel.fillStyle = "#c3cad4";
          pincel.font = '15px "Consolas", monospace';
          filas.forEach((texto, i) =>
            pincel.fillText(texto, 16, ZONA_Y + 22 + (resumen.length + i) * 20),
          );

          pincel.restore();
        }

        /**
         * Aplica al pincel el giro y el aplastamiento de una pelota.
         *
         * Va aparte porque lo usan la foto y el aro, y porque **no** lo usa lo que
         * tiene que quedarse recto: la corona, los efectos y la etiqueta. El
         * aplastamiento va en la direccion del golpe (`squash.angulo`) y el giro
         * encima, que es lo que hace que la pelota ruede.
         *
         * Se ahorra el `save`/`restore` mas caro —el de la matriz— cuando no hay
         * nada que aplicar: en reposo esto es una comparacion.
         */
        function aplicarDeformacion(p) {
          const sq = p.squash.valor;
          const giro = p.angulo;
          if (Math.abs(sq) < 0.004 && Math.abs(giro) < 0.002) return;

          pincel.translate(p.x, p.y);
          if (giro) pincel.rotate(giro);
          if (Math.abs(sq) >= 0.004) {
            pincel.rotate(p.squash.angulo);
            // Aplasta en el eje del golpe y estira en el perpendicular. El area
            // cambia un poco a proposito: es el gesto de una pelota que se chafa.
            pincel.scale(1 + sq, 1 - sq);
            pincel.rotate(-p.squash.angulo);
          }
          pincel.translate(-p.x, -p.y);
        }

        function pintar(tiempo) {
          // `clearRect` y no un relleno: fuera de las bolas el lienzo tiene que
          // quedar transparente para que el video del streamer se vea.
          pincel.clearRect(0, 0, ANCHO, ALTO);
          etiquetasPintadas = [];
          // Las ondas van debajo de las pelotas: se ven, pero no las tapan.
          pintarOndas();
          // Las pequenas primero: la grande queda por encima. La escala entra en
          // el criterio porque una pelota que acaba de nacer mide cero.
          const lista = [...pelotas.values()].sort(
            (a, b) => a.radio * a.escala - b.radio * b.escala,
          );
          for (const p of lista) {
            pincel.globalAlpha = 1;
            pintarPelota(p);
          }
          pincel.globalAlpha = 1;
          // Con la depuracion apagada esto es una comparacion y nada mas.
          if (DEBUG_FISICA) pintarDebug(lista);
        }

        /** El aro que se expande de una onda de choque, apagandose hacia fuera. */
        function pintarOndas() {
          if (!ondas.length) return;
          for (const o of ondas) {
            const vida = (ahora - o.inicio) / ONDA_MS;
            if (vida < 0 || vida >= 1) continue;
            const radio = Math.max(2, ONDA_RADIO * (0.35 + 0.65 * vida));
            pincel.beginPath();
            pincel.arc(o.x, o.y, radio, 0, Math.PI * 2);
            pincel.lineWidth = 3 + 9 * (1 - vida);
            pincel.strokeStyle = ACENTO;
            pincel.globalAlpha = (1 - vida) * 0.45;
            pincel.stroke();
            pincel.globalAlpha = 1;
          }
        }

        // --- Bucle -----------------------------------------------------------

        let anterior = 0;

        /**
         * Un fotograma. Se le pasa la marca de tiempo de `ctx.animar`, que es la
         * misma que la de `performance.now()`: asi el lienzo y las fisicas miden
         * el tiempo con el mismo reloj.
         */
        function fotograma(tiempo) {
          // El paso se acota: si la pestana estuvo oculta (OBS pausa el Browser
          // Source), un salto de varios segundos despediria las pelotas.
          const dt = Math.min(0.032, Math.max(0, (tiempo - anterior) / 1000));
          anterior = tiempo;
          ahora = tiempo;
          anotarFotograma(dt * 1000);
          // La simulacion va **antes** del paso: es lo que acumula los taps de este
          // fotograma, igual que `pintar` los acumula cuando llegan del directo.
          if (SIMULAR_FISICA) avanzarSimulacion(dt);
          paso(dt);
          pintar(tiempo);
        }

        return {
          montar(raiz, contexto) {
            const lienzo = raiz.querySelector("#lienzo");
            // Un solo contexto para toda la vida del diseno: pedirlo en cada
            // fotograma devolveria el mismo objeto, pero ademas asi se falla una
            // sola vez y en `montar`, donde `comun.js` lo enseña en el aviso.
            pincel = lienzo.getContext("2d", { alpha: true });

            reducido = !!contexto.reducido;
            // Se copian los formateadores del runtime en vez de llamarlos en cada
            // fotograma: son dos indirecciones por pelota y por segundo, pero
            // sobre todo dejan claro que este diseno no formatea cifras por su
            // cuenta. Un segundo formato en la misma pantalla se nota.
            numero = (valor) => contexto.numero(valor);
            nombreDe = (entrada) => contexto.nombre(entrada);

            // El rotulo del lienzo (el "1080 x 1920") es el sitio que ya existe,
            // abajo a la izquierda, para enseñar el escenario en modo simulacion.
            // En antena no se toca: ni se busca el nodo.
            if (SIMULAR_FISICA) {
              sim.rotulo = raiz.querySelector(".medida");
              arrancarSimulacion();
            }

            // Nada de `requestAnimationFrame` directo: si un fotograma lanza,
            // `ctx.animar` lo cuenta, lo enseña en el aviso y **sigue dibujando**.
            // Es exactamente el fallo que congelo este diseno en un directo.
            contexto.animar(() => {
              try {
                fotograma(performance.now());
              } catch (error) {
                // Aviso como mucho una vez. `ctx.animar` ya protege el bucle; lo
                // que evita este try es que el primer fotograma roto deje el
                // lienzo a medias y encima salga por consola sesenta veces por
                // segundo, que en la consola de OBS no le sirve a nadie.
                if (!window.__pelotasAvisado) {
                  window.__pelotasAvisado = true;
                  contexto.anunciar("Error al dibujar: " + (error?.message ?? error), false);
                }
              }
            });
          },

          pintar(entradas, tasas) {
            // Con la simulacion encendida los datos de fuera se ignoran: los taps
            // los inventa `avanzarSimulacion`, y contra **estas mismas** funciones
            // (`sincronizar` y `observarRitmo`), asi que sigue siendo la fisica de
            // antena. Si no se ignoraran, la previa (`?demo=1`) y la simulacion
            // pelearian por la misma tabla.
            if (SIMULAR_FISICA) return;

            // `pintar` corre una vez por segundo, pero el bucle sigue a 60: la
            // primera marca de cada tanda decide quien esta en racha y la fisica
            // hace el resto.
            sincronizar(entradas);

            const tasasNuevas = new Map();
            for (const [clave, p] of pelotas) {
              const tasa = Number(tasas.get(clave)) || 0;
              tasasNuevas.set(clave, tasa);
              // Las que se estan yendo ya no tocan: su tasa se guarda, pero no se
              // les da empujon.
              if (p.morir > 0) continue;
              // Se mira tambien la bajada: cuando alguien deja de tocar, la tasa
              // cae y eso es justo lo que apaga la efervescencia.
              if (!p.ritmo.nuevo && tasa === tasaDe.get(clave)) continue;
              p.ritmo.nuevo = false;
              observarRitmo(p, p.valor, tasa);
            }
            tasaDe = tasasNuevas;
          },

          /**
           * Enciende una fuerza global temporal, en px/s², durante `ms`.
           *
           * Es el gancho de `empujarGlobal`: gravedad, anti-gravedad o un empuje
           * lateral para un momento concreto. No lo usa nadie todavia y el overlay
           * de OBS no lo llama: existe para que añadirlo despues no obligue a tocar
           * la fisica.
           */
          fuerzaGlobal(x, y, ms) {
            fuerzaGlobal.x = Number(x) || 0;
            fuerzaGlobal.y = Number(y) || 0;
            fuerzaGlobal.hasta = ahora + (Number(ms) || 1000);
          },
        };
      })();
    </script>
    <script src="comun.js"></script>
  </body>
</html>
