<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Pelotas · Overlay</title>
    <link rel="stylesheet" href="comun.css" />
    <!-- Pelotas: lienzo de 1080x1920 a pantalla completa. Las fotos del publico
         rebotan en el cuarto de abajo —la zona que deja libre el video del
         streamer—, crecen con los taps y se empujan entre ellas. El nº1 nada
         como un tiburon y aparta a quien se cruza.

         Es el unico diseno que anima a 60 fotogramas por segundo y el unico que
         se quedo congelado en un directo, asi que aqui el dibujado va doblemente
         protegido: por `ctx.animar` (que no deja morir el bucle) y por el
         try/catch de dentro, que ademas revisa los valores antes de dibujarlos. -->
    <style>
      /* La previa escala el marco con el lienzo declarado en el catalogo, asi que
         la caja tiene que medir exactamente 1080x1920: con una caja elastica el
         canvas se estiraba a lo ancho y la franja de juego dejaba de cuadrar. */
      #raiz {
        height: 1920px;
        padding: 0;
        position: relative;
        width: 1080px;
      }

      #lienzo {
        display: block;
        height: 1920px;
        width: 1080px;
      }

      /* El aviso va sobre video y en una esquina, asi que necesita su propio
         respaldo: aqui no hay tarjeta detras, y a 28 px sobre un fondo claro se
         perdia. Es la leccion repetida de todos los disenos. */
      .aviso {
        background: var(--velo);
        border: 1px solid var(--borde);
        border-radius: 999px;
        bottom: 26px;
        font-size: 28px;
        padding: 10px 22px;
        position: absolute;
        right: 30px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        z-index: 2;
      }

      /* Al pie del lienzo y del lado contrario al aviso, para no pisarlo. El
         mismo hueco compartido que usan las pistas de las tablas: es texto
         suelto sobre video y sin respaldo no se lee. */
      .medida {
        background: var(--hueco);
        border-radius: 999px;
        bottom: 30px;
        color: #c3cad4;
        font-size: 22px;
        left: 30px;
        padding: 6px 16px;
        position: absolute;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      }
    </style>
  </head>
  <body>
    <div class="vista" id="raiz">
      <canvas id="lienzo" width="1080" height="1920"></canvas>
      <p class="medida">1080 × 1920</p>
      <p class="aviso" id="aviso">Conectando…</p>
    </div>

    <script>
      /* Solo **define** el diseno. Arrancar es cosa de `comun.js`, que se carga
         despues: asi el orden (montar, y luego los datos) es el mismo en todos los
         disenos y no depende de como este escrito cada uno. */
      window.diseno = (() => {
        // --- Lienzo ----------------------------------------------------------
        //
        // Cuadrado con el `<canvas>`: 1 pixel de lienzo por pixel de OBS. El
        // parametro `escala` del Browser Source ya estira el resultado, asi que
        // multiplicar por `devicePixelRatio` no daria mas detalle y si un backing
        // store enorme (1080x1920 a 2x son 8,3 Mpx por fotograma).

        const ANCHO = 1080;
        const ALTO = 1920;

        // --- Zona de juego ---------------------------------------------------
        //
        // La franja donde rebotan las pelotas es el cuarto de abajo del lienzo:
        // arriba esta el video del streamer y ahi no se dibuja **nada**. El ancho
        // es el del lienzo entero, para que las bolas crucen de lado a lado.

        const ZONA_ALTO = ALTO / 4; // 480 px
        const ZONA_Y = 1440; // ALTO - ZONA_ALTO
        const ZONA_ANCHO = ANCHO;

        // --- Tamano de las pelotas -------------------------------------------
        //
        // El tamano es una **recompensa que se acumula**: sale de los taps que lleva
        // cada persona, no de la comparacion con los demas. La cuenta esta en
        // `repartirRadios`.

        /**
         * Radio minimo y maximo, en px.
         *
         * Los dos son el suelo y el techo de la interpolacion, y el minimo es tambien
         * el suelo de legibilidad: por debajo de 26 px el aro se come la foto y la
         * inicial deja de leerse. El maximo son los 124,8 que pedia la franja por 0,8
         * —la escala global que se bajo cuando el nº1 se comia el lienzo— y es el
         * tamano mas grande que cabe sin tapar a las demas.
         */
        const RADIO_MIN = 26;
        const RADIO_MAX = 100;

        /**
         * Taps a los que una pelota llega a su tamano maximo.
         *
         * Es la cifra que gobierna el crecimiento entero: 0 taps es el minimo, 7.500 la
         * mitad del recorrido y 15.000 el tope. Mas alla **no crece**, para que un
         * directo largo no acabe con diez pelotas gigantes.
         */
        const TAPS_TOPE = 15000;

        /**
         * Tope de area del conjunto, como fraccion de la franja.
         *
         * Es una **red de seguridad**, no la curva: si las pelotas que piden tamano
         * grande no caben juntas, se comprime lo que sobresale del minimo —nunca el
         * minimo, que es la legibilidad—. Sale de los 0,22 de antes por la escala global
         * de 0,8 al cuadrado (0,22 x 0,64 = 0,14), que es lo que ocupaba el conjunto
         * cuando se bajo la escala y se vio que asi la fisica tenia sitio para correr.
         */
        const AREA_TOPE = 0.14;
        const TOPE = 12;

        /**
         * Radio a partir del cual una pelota lleva etiqueta (nombre y cifra).
         *
         * Son los 52 de antes por la misma escala de 0,8: lo que tiene que encoger con
         * el tamano es el tamano, no la informacion.
         */
        const RADIO_ETIQUETA = 42;

        // --- Movimiento ------------------------------------------------------

        const VELOCIDAD_MINIMA = 130;
        const VELOCIDAD_MAXIMA = 900;
        // Cuanto mas deprisa vuelve una pelota a su crucero.
        //
        // Con la prisa de antes (1) los choques mandaban sobre el control: la
        // velocidad media real era 1,42x el crucero y el jitter un 55%, porque el
        // impulso de un choque entra **despues** del control y solo se recortaba
        // en el fotograma siguiente.
        //
        // Medido por dos caminos. En el port (`.tooling/sonda-fisica-pelotas.mjs`)
        // el jitter baja al 51-53% y el tiempo por encima del doble del crucero,
        // del 13% al 8%. Sobre el fichero de verdad, con tres semillas
        // (`.tooling/verificar-diseno-pelotas.mjs`): jitter maximo 81% -> 73%,
        // tiempo por encima del doble del crucero 26% -> 20%, velocidad maxima
        // 500 -> 463 px/s.
        //
        // El empujon no se pierde: el pico de una racha pasa de 10,5x a 9,7x su
        // crucero, y lo que tarda en volver al crucero no cambia (880 -> 908 ms).
        // Lo que el publico mira dura lo mismo.
        const PRISA_CONTROL = 4;
        const EMPUJON_VELOCIDAD = 620;
        /**
         * Amplitud de la sacudida de una racha, por `sqrt(dt)`.
         *
         * El 310 sale de repartir los 2400 que se usaban con `dt`: 2400/60 = 40, y
         * 40 / sqrt(1/60) = 310. A 60 fps empuja igual que antes y a cualquier otro
         * ritmo empuja lo que toca.
         */
        const SACUDIDA = 310;
        const EMPUJON_MS = 2600; // cuanto dura la efervescencia
        const RAFAGA_MS = 2500; // ventana en la que se mide el ritmo
        const TAPS_RAFAGA = 4; // taps en una vuelta que cuentan como rafaga

        // --- Constantes de la fisica -----------------------------------------
        //
        // Todas juntas y ninguna por pelota: la restitucion y la friccion son del
        // diseno, no de cada bola, y tenerlas aqui es lo que permite ajustarlas
        // mirando el overlay en vez de bucear entre el estado.

        /** Restitucion de la pared. 1 = no se pierde nada; ver `rebotarEnBordes`. */
        const RESTITUCION_PARED = 1;
        /** Restitucion entre dos pelotas. Un pelo por debajo de 1 y ya no vibran. */
        const RESTITUCION_PAR = 0.96;
        /** Friccion tangencial, muy baja, y su tope (rozamiento de Coulomb). */
        const FRICCION = 0.07;
        const FRICCION_TOPE = 0.06;
        /** Cuanto giro aporta un roce. */
        const GIRO_PARED = 0.045;
        const GIRO_CHOQUE = 0.7;
        /**
         * Tope del angulo **dibujado**, en radianes (0,18 = 10,3 grados).
         *
         * La velocidad angular puede ser mayor; lo que no puede es acabar con la
         * cara del usuario boca abajo.
         */
        const ANGULO_MAX = 0.18;
        /**
         * El angulo vuelve solo a la vertical, como un muñeco de resorte.
         *
         * Sin esto la pelota se quedaba **inclinada para siempre**: el tope le ponia
         * la velocidad angular a cero y ya no habia nada que la devolviera. Ahora un
         * golpe la ladea, se pasa un poco y vuelve a su sitio: el giro es un gesto,
         * no un estado.
         */
        const ANGULO_MUELLE = 35;
        const ANGULO_AMORTIGUACION = 6;
        /** Tope de la velocidad angular: un mordisco no puede dar un latigazo. */
        const GIRO_MAX = 6;
        /** Muelle del radio: rigidez y amortiguacion (sube y rebota un poco). */
        const RADIO_MUELLE = 90;
        const RADIO_AMORTIGUACION = 13;
        /** Muelle del squash: mas rigido y mas amortiguado, porque es visual. */
        const SQUASH_MUELLE = 260;
        const SQUASH_AMORTIGUACION = 22;
        const SQUASH_MAX = 0.3;
        const SQUASH_MIN = -0.15;
        /** Cuanto dura el rastro de una racha, en ms, y cuantos puntos como mucho. */
        const RASTRO_MS = 150;
        const RASTRO_MAX = 26;

        // --- Energia de taps --------------------------------------------------
        //
        // Los taps **acumulan** energia en vez de dar un empujon suelto: un tap
        // cuenta poco, varios seguidos cuentan mas y una racha llena la pelota. Esa
        // energia es la que decide la fuerza del impulso, el pulso visual, las
        // chispas, la deformacion y la onda de choque, asi que un solo numero
        // gobierna todo lo que se siente al tocar.
        //
        // La subida va con la **raiz** de los taps de la vuelta: el tap 20 no puede
        // valer 20 veces el primero, o el que se pica una vez se lleva la franja.

        /** Tope de energia. */
        const ENERGIA_MAX = 8;
        /** Cuanto sube por la raiz de cada tap, y cuanto tarda en caer (segundos). */
        const ENERGIA_POR_TAP = 1;
        const ENERGIA_TAU = 1.8;
        /** Micro impulso de un tap suelto: se tiene que notar, no mover. */
        const EMPUJON_MICRO = 46;

        // --- Onda de choque ---------------------------------------------------
        //
        // De una racha fuerte sale una onda que empuja a las **vecinas**, con menos
        // fuerza cuanto mas lejos. No es una explosion: en su vida entera (260 ms)
        // la onda mete del orden de una velocidad de crucero a quien la pilla al
        // lado, y a la mitad de distancia, la mitad.
        const ONDA_MS = 260;
        const ONDA_RADIO = 300;
        const ONDA_FUERZA = 1500;
        const ONDA_MINIMA = 0.45; // energia relativa a partir de la cual hay onda
        const ONDAS_MAX = 6;
        /** Anti-atasco: cada cuanto puede empujar (ms) y cuanto empuja (px/s). */
        const ATASCO_MS = 600;
        const EMPUJON_ATASCO = 26;
        /** Trayectoria recta: a partir de cuanto tiempo se corrige y cuanto gira. */
        const RECTA_MS = 3000;
        const RECTA_GIRO = 0.08;

        // --- Anti-atasco y trayectorias ---------------------------------------
        //
        // Dos correctores que **no** sustituyen a nada: el solver de choques y el
        // control de crucero siguen haciendo su trabajo, y esto solo toca los dos
        // casos que se quedan fuera de lo que ellos saben arreglar.

        /**
         * Anti-atasco: cuando una pelota lleva mucho rato sin moverse **y** su
         * velocidad es casi cero, se le da un empujon minimo hacia donde esta mas
         * hueco.
         *
         * Es el caso de dos o tres pelotas apretadas en una esquina que se sostienen
         * unas a otras: el solver las separa, el crucero las empuja, y ahi se quedan
         * vibrando. El empujon (26 px/s, menos que el crucero de la mas pequena) se
         * aplica como mucho una vez cada 600 ms y solo si en ese tiempo no se ha
         * movido 3 px, asi que no se puede notar.
         */
        function desatascar(p) {
          const a = p.atasco;
          const movida = Math.hypot(p.x - a.x, p.y - a.y);
          const v = Math.hypot(p.vx, p.vy);
          const { crucero } = limitesDe(p);

          if (a.desde === 0 || movida > 3 || v > crucero * 0.35) {
            a.x = p.x;
            a.y = p.y;
            a.desde = ahora;
            return;
          }
          if (ahora - a.desde < ATASCO_MS) return;

          let vecina = null;
          let mejor = Infinity;
          for (const otra of pelotas.values()) {
            if (otra === p || otra.morir > 0) continue;
            const d = Math.hypot(otra.x - p.x, otra.y - p.y);
            if (d < mejor) {
              mejor = d;
              vecina = otra;
            }
          }
          if (vecina) {
            const dx = p.x - vecina.x;
            const dy = p.y - vecina.y;
            const d = Math.hypot(dx, dy) || 1;
            p.vx += (dx / d) * EMPUJON_ATASCO;
            p.vy += (dy / d) * EMPUJON_ATASCO;
          } else {
            p.vx += EMPUJON_ATASCO * (Math.random() < 0.5 ? -1 : 1);
          }
          a.x = p.x;
          a.y = p.y;
          a.desde = ahora;
        }

        /** Diferencia entre dos angulos, por el camino corto. */
        function diferenciaAngular(a, b) {
          let d = a - b;
          while (d > Math.PI) d -= Math.PI * 2;
          while (d < -Math.PI) d += Math.PI * 2;
          return d;
        }

        /**
         * Rompe las trayectorias rectas que se eternizan.
         *
         * Una pelota que lleva tres segundos en la misma direccion se lee como un
         * objeto deslizandose, no como una bola dentro de un juego: pasa cuando una
         * pequena coge una horizontal larga con su crucero bajo. La correccion es un
         * giro de 4,6 grados **una sola vez**; lo que no se hace es meter ruido
         * aleatorio en cada fotograma, que es la forma de que la franja parezca
         * temblar.
         */
        function romperTrayectoria(p) {
          const v = Math.hypot(p.vx, p.vy);
          if (v < 1) return;
          const direccion = Math.atan2(p.vy, p.vx);
          const r = p.recta;

          if (r.angulo === null || Math.abs(diferenciaAngular(direccion, r.angulo)) > 0.06) {
            r.angulo = direccion;
            r.desde = ahora;
            return;
          }
          if (ahora - r.desde < RECTA_MS) return;

          const desvio = (Math.random() < 0.5 ? -1 : 1) * RECTA_GIRO;
          const cos = Math.cos(desvio);
          const sin = Math.sin(desvio);
          const vx = p.vx * cos - p.vy * sin;
          const vy = p.vx * sin + p.vy * cos;
          p.vx = vx;
          p.vy = vy;
          r.angulo = Math.atan2(p.vy, p.vx);
          r.desde = ahora;
        }

        /**
         * Fuerzas globales temporales: gravedad, anti-gravedad, empuje lateral.
         *
         * **No hay ninguna activa**: con la estructura en cero esto es una
         * comparacion que no se cumple. La gravedad permanente esta descartada a
         * proposito —la franja mide 480 px y una gravedad constante apilaria todas
         * las fotos contra el suelo—, pero la puerta queda abierta: lo que se ponga
         * aqui se aplica a todas por igual y se apaga solo al vencer `hasta`.
         *
         * Se enciende desde fuera con `window.diseno.fuerzaGlobal(x, y, ms)`, sin
         * tocar nada mas: es el gancho que hara falta si algun dia se quiere un
         * "modo gravedad" para una racha concreta.
         */
        const fuerzaGlobal = { x: 0, y: 0, hasta: 0 };

        function empujarGlobal(p, dt) {
          if (ahora >= fuerzaGlobal.hasta) return;
          p.vx += fuerzaGlobal.x * dt;
          p.vy += fuerzaGlobal.y * dt;
        }

        // El nº1 nada a velocidad constante y se le suma una atraccion suave
        // hacia el centro para que no se quede atrapado en una esquina.
        const VELOCIDAD_TIBURON = 150;
        const ATRAER_CENTRO = 120;
        const EMPUJON_TIBURON = 1.9; // cuanto mas fuerte aparta a quien choca

        // Sin tope, una rafaga fuerte soltaba 340 chispas y en el lienzo se veia
        // un borron rosa, no chispas. Ademas cada chispa es un `arc` por
        // fotograma: con 12 pelotas, el tope es lo que mantiene el coste acotado.
        const CHISPAS_MAX = 70;

        // --- Modo de trabajo -------------------------------------------------
        //
        // Dos interruptores que **solo** existen para trabajar sobre la fisica y
        // que en antena valen `false`:
        //
        //   * `DEBUG_FISICA`: pinta el circulo de colision, el vector de velocidad,
        //     el centro, la masa, la energia y los topes de cada pelota. Con
        //     `false` no dibuja absolutamente nada de mas.
        //   * `SIMULAR_FISICA`: el diseno se inventa los taps y va recorriendo
        //     escenarios por su cuenta, para juzgar la fisica sin esperar a que el
        //     publico toque justo en ese momento. Trabaja contra las MISMAS
        //     funciones que el camino de verdad (`sincronizar` y `observarRitmo`),
        //     asi que lo que se ve con el encendido es la fisica de antena.
        //
        // Se encienden por la URL, que es como se prueba en el navegador:
        //
        //   ?view=tap&diseno=pelotas&demo=1&fisica=1
        //   ?view=tap&diseno=pelotas&demo=1&sim=1
        //   ...&sim=1&escenario=rafaga_top1&pelotas=5&semilla=7
        //
        // El overlay que se pega en OBS no lleva esos parametros, asi que las dos
        // constantes quedan en `false` y el camino normal no paga nada: dos
        // comparaciones por fotograma.
        const OPCIONES = new URLSearchParams(location.search);
        const DEBUG_FISICA = OPCIONES.has("fisica") || OPCIONES.get("physicsDebug") === "1";
        const SIMULAR_FISICA = OPCIONES.has("sim") || DEBUG_FISICA;
        /** Cuantas pelotas inventa la simulacion: 2, 5, 10 o lo que se pida. */
        const SIM_PELOTAS = Math.max(2, Math.min(TOPE, Number(OPCIONES.get("pelotas")) || 10));
        /** Escenario fijo; sin el, la simulacion los va recorriendo en orden. */
        const SIM_ESCENARIO = OPCIONES.get("escenario") || null;
        const SIM_SEMILLA = Number(OPCIONES.get("semilla")) || 0x5eed17;

        // --- Colores ---------------------------------------------------------
        //
        // Los mismos valores que los tokens de `comun.css` (--lider, --acento,
        // --texto, --borde, --hueco, --vuelta). En el canvas no hay `var()`: el
        // contexto 2D no resuelve variables CSS, asi que los tonos se repiten
        // aqui a mano y **tienen que seguir cuadrando** con comun.css. El unico
        // que se aparta es el respaldo de las etiquetas, que se queda en el
        // #080A0E de la maqueta porque es una caja sobre video, no un token.

        const LIDER = "#ff2e63";
        const ACENTO = "#25f4ee";
        const TEXTO = "#e8eaf0";
        const APAGADO = "#8c93a3";
        const BORDE = "#232936";
        const HUECO = "rgba(44, 52, 68, 0.55)";
        const VUELTA = "#f5c451";
        const BLANCO = "#ffffff";
        const TINTA = "#080a0e";
        const TINTA_LIDER = "#12030a";
        const CARA_SIN_FOTO = "#2c3444";

        // --- Estado ----------------------------------------------------------

        /** clave -> pelota. La clave es la del runtime, para que `tasas` cuadre. */
        const pelotas = new Map();
        /** url -> Image, para no volver a pedir la misma foto en cada vuelta. */
        const imagenes = new Map();
        let pincel = null;
        let reducido = false;
        /** Formateadores del runtime. Se copian en `montar`; ver el comentario. */
        let numero = (valor) => String(valor);
        let nombreDe = (entrada) => entrada?.user?.nickname ?? "?";
        /** `performance.now()` del ultimo fotograma: lo leen las fisicas. */
        let ahora = 0;
        /** clave -> tasa de la vuelta anterior, para notar tambien las bajadas. */
        let tasaDe = new Map();
        /** Cajas de etiqueta ya pintadas, para que no se pisen entre ellas. */
        let etiquetasPintadas = [];
        /**
         * Ondas de choque vivas.
         *
         * Van en una lista suelta y no dentro de la pelota que las suelta: la onda
         * sobrevive a su dueña (una racha puede coincidir con que esa persona baje
         * puestos) y afecta a las vecinas, no a ella.
         */
        const ondas = [];

        const seSolapan = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;

        /**
         * Foto de reserva cuando TikTok no manda avatar, o cuando la que manda
         * falla. Los `||` no son de mas: el runtime ya cae a `@usuario` si el
         * apodo viene vacio, y aqui se hace lo mismo porque un apodo vacio deja
         * la pelota en blanco.
         */
        function inicialDe(entrada) {
          const nombre = (entrada?.user?.nickname || "").trim();
          const usuario = (entrada?.user?.unique_id || "").trim();
          return (nombre || usuario || "?").slice(0, 1).toUpperCase();
        }

        function cargarImagen(url) {
          if (imagenes.has(url)) return imagenes.get(url);
          const img = new Image();
          // El overlay y el servidor de TikTok no son el mismo origen: sin esto
          // la foto se descarga igual pero **no se puede pintar** en el canvas.
          // Si aun asi faltan cabeceras CORS, `pintarPelota` lo detecta al
          // comprobar `naturalWidth` y cae a la inicial. Nunca se pinta una foto
          // de otro en el hueco de alguien.
          img.crossOrigin = "anonymous";
          img.referrerPolicy = "no-referrer";
          img.src = url;
          imagenes.set(url, img);
          return img;
        }

        // --- Reparto de radios -----------------------------------------------

        /**
         * Convierte los taps de cada persona en el tamano de su pelota.
         *
         * Dos pasos, y el primero es el que manda:
         *
         *   1. **La curva, absoluta**: `progreso = taps / TAPS_TOPE`, saturado a 1. Con
         *      0 taps la pelota esta en el minimo, a 7.500 exactamente a la mitad del
         *      recorrido y a 15.000 en el maximo. De ahi para arriba ya no crece.
         *   2. **El tope de area**, que es red de seguridad y no curva: si las que piden
         *      tamano grande no caben juntas en la franja, se comprime lo que sobresale
         *      del minimo —nunca el minimo— y el reparto se queda como estaba, solo mas
         *      pequeno. Con una nº1 destacada y una cola corta no llega a entrar.
         *
         * Antes la curva era **relativa**: `sqrt(v / v_max)` de la tabla de cada vuelta.
         * Aquello ponia a la nº1 llena siempre —con 40 taps o con 40.000— porque la
         * escala se reajustaba sola en cada actualizacion, y el tamano acababa diciendo
         * quien iba primero, no cuanto se habia tocado. Con la curva absoluta el tamano
         * se acumula durante el directo, que es lo que se pidio: crecimiento lento,
         * gradual, y con recorrido para una live larga.
         *
         * Lo que **no** cambia: el reparto sigue siendo monotono en taps (quien mas
         * tiene nunca es mas pequeno) y el minimo sigue siendo el mismo suelo legible.
         */
        function repartirRadios(entradas) {
          // 1. La curva: absoluta, saturada y sin escalones.
          const progreso = entradas.map((e) =>
            Math.max(0, Math.min(1, (Number(e.value) || 0) / TAPS_TOPE)),
          );
          const ideales = progreso.map((t) => RADIO_MIN + (RADIO_MAX - RADIO_MIN) * t);

          // 2. El tope de area: se comprime lo que sobresale del minimo. El area con el
          // factor `f` es un polinomio de segundo grado en `f` —`pi * (n*m^2 +
          // 2*m*f*S1 + f^2*S2)`—, asi que el factor que la deja justo en el tope sale de
          // la raiz positiva de la ecuacion.
          const sobresale = ideales.map((r) => Math.max(0, r - RADIO_MIN));
          const n = entradas.length;
          const presupuesto = ZONA_ANCHO * ZONA_ALTO * AREA_TOPE;
          const sumaSobra = sobresale.reduce((suma, d) => suma + d, 0);
          const sumaSobra2 = sobresale.reduce((suma, d) => suma + d * d, 0);
          let factor = 1;
          const areaDe = (f) =>
            Math.PI * (n * RADIO_MIN * RADIO_MIN + 2 * RADIO_MIN * f * sumaSobra + f * f * sumaSobra2);
          if (sumaSobra2 > 0 && areaDe(1) > presupuesto) {
            const b = 2 * RADIO_MIN * sumaSobra;
            const c = n * RADIO_MIN * RADIO_MIN - presupuesto / Math.PI;
            const discriminante = b * b - 4 * sumaSobra2 * c;
            factor =
              discriminante <= 0
                ? 0
                : Math.max(0, Math.min(1, (-b + Math.sqrt(discriminante)) / (2 * sumaSobra2)));
          }

          const radios = new Map();
          entradas.forEach((e, i) => {
            radios.set(window.ritmo.clave(e, i), RADIO_MIN + sobresale[i] * factor);
          });
          return radios;
        }

        // --- Entrada y salida de las pelotas ---------------------------------

        /**
         * Busca un sitio donde quepa una pelota nueva.
         *
         * Nacer encima de otra la empuja: el solver las separa en el mismo fotograma,
         * pero se ve el tiron, y cuando entran varias a la vez —el arranque de un
         * directo, un cambio de tabla— se veian solapes de hasta 36 px (medido en el
         * banco). Ocho intentos y se queda con el mas despejado, que cuesta
         * microsegundos y solo pasa al crear.
         */
        function sitioLibre(radio) {
          const lados = Math.max(14, radio * 0.28);
          const abajo = Math.max(44, radio * 0.32);
          const xMin = radio + lados;
          const xMax = ZONA_ANCHO - radio - lados;
          const yMin = ZONA_Y + radio;
          const yMax = ALTO - radio - abajo;

          let mejor = null;
          let mejorHueco = -Infinity;
          for (let intento = 0; intento < 8; intento++) {
            const x = xMin + Math.random() * Math.max(1, xMax - xMin);
            const y = yMin + Math.random() * Math.max(1, yMax - yMin);
            let hueco = Infinity;
            for (const otra of pelotas.values()) {
              hueco = Math.min(hueco, Math.hypot(otra.x - x, otra.y - y) - otra.radio - radio);
            }
            if (hueco > mejorHueco) {
              mejorHueco = hueco;
              mejor = { x, y };
            }
            if (hueco > 8) break; // sitio de sobra
          }
          return mejor;
        }

        /**
         * Una pelota nueva, con **todo** su estado en un solo sitio.
         *
         * La fisica lee y escribe muchos numeros por pelota (velocidad, radio,
         * angulo, energia, deformacion, atascos). Repartidos por el fichero, uno se
         * queda sin inicializar y sale `NaN` en el lienzo **sin ningun error**: el
         * canvas ignora los trazos no finitos y la pelota simplemente deja de
         * dibujarse. Aqui estan todos.
         *
         * Lo que **no** se guarda, porque se deduce de lo anterior y guardarlo
         * seria tener dos verdades que se pueden separar:
         *
         *   * el crucero (`velocidadObjetivo`) y el tope (`velocidadMaxima`) salen
         *     de `limitesDe`, que ya los calculaba en cada fotograma;
         *   * la masa sale de `masaDe` (radio, mas el empujon de una racha);
         *   * la restitucion y la friccion son constantes del diseno, no de la
         *     pelota: viven arriba, con las demas.
         */
        function crearPelota(clave, e, i, radioObjetivo) {
          const angulo = Math.random() * Math.PI * 2;
          // La velocidad de arranque va con el tamano: una pelota pequena arranca
          // despacio, para que no parezca tan importante como el lider. Es el mismo
          // criterio que `pesoMovimiento`.
          const velocidad =
            (VELOCIDAD_MINIMA + Math.random() * 160) *
            (0.3 + 0.7 * Math.pow(radioObjetivo / RADIO_MAX, 1.5));
          const sitio = sitioLibre(radioObjetivo);
          return {
            clave,
            x: sitio.x,
            y: sitio.y,
            vx: Math.cos(angulo) * velocidad,
            vy: Math.sin(angulo) * velocidad,
            // --- Tamano: un muelle, no un salto ---
            radio: radioObjetivo,
            radioObjetivo,
            /** Velocidad del muelle del radio, en px/s. */
            velocidadRadio: 0,
            // --- Giro (visual, acotado por ANGULO_MAX al dibujar) ---
            angulo: 0,
            velocidadAngular: 0,
            // --- Deformacion al impactar: solo visual ---
            squash: { valor: 0, velocidad: 0, angulo: 0 },
            // --- Taps ---
            energia: { valor: 0 },
            valor: Number(e.value) || 0,
            nombre: nombreDe(e),
            inicial: inicialDe(e),
            foto: null,
            puesto: i,
            // Nace a escala 0 y crece: antes la pelota aparecia de golpe.
            escala: 0,
            /** Posiciones recientes con su marca de tiempo; ver `paso`. */
            rastro: [],
            empujadoHasta: 0,
            morir: 0,
            /** Anti-atasco: donde estaba y desde cuando no se mueve. */
            atasco: { x: 0, y: 0, desde: 0 },
            /** Trayectoria repetitiva: desde cuando va en la misma direccion. */
            recta: { angulo: null, desde: 0 },
            // Ritmo de esta persona. `empujonHasta` es cuando se le acaba la
            // efervescencia, `pulso` la ultima subida (el aro que se expande)
            // y `chispas` las particulas vivas de la rafaga.
            ritmo: {
              ultimo: Number(e.value) || 0,
              t: false,
              empujonHasta: 0,
              pulso: 0,
              chispas: [],
              nuevo: true,
            },
            tiburon: i === 0,
          };
        }

        /**
         * Crea o actualiza una pelota, conservando su sitio y su velocidad.
         *
         * Una pelota que ya estaba **no se recrea**: si se hiciera, cada
         * actualizacion volveria a empezar la animacion de entrada y la franja
         * pareceria un parpadeo.
         */
        function sincronizar(entradas) {
          const visibles = entradas.slice(0, TOPE);
          const radios = repartirRadios(visibles);

          const vivas = new Set();
          visibles.forEach((e, i) => {
            const clave = window.ritmo.clave(e, i);
            vivas.add(clave);

            const radioObjetivo = radios.get(clave) ?? RADIO_MIN;
            let p = pelotas.get(clave);
            if (!p) {
              p = crearPelota(clave, e, i, radioObjetivo);
              pelotas.set(clave, p);
            }

            p.radioObjetivo = radioObjetivo;
            p.nombre = nombreDe(e);
            p.inicial = inicialDe(e);
            p.puesto = i;
            p.morir = 0;
            // El contador solo sube en TikTok, pero se copia igual: si algun dia
            // bajara, la etiqueta no puede quedarse con una cifra vieja.
            p.valor = Number(e.value) || 0;
            p.foto = e.user?.avatar_url ? cargarImagen(e.user.avatar_url) : null;
            // Dato nuevo: `pintar` mirara esta marca para decidir si hay rafaga.
            p.ritmo.nuevo = true;
          });

          // Quien sale de la tabla **no desaparece de golpe**: se marca para
          // encogerse y se quita del todo cuando acaba la animacion. Sus chispas
          // se sueltan ya: si no, seguirian dibujandose en un sitio donde la
          // pelota ha dejado de moverse.
          for (const p of pelotas.values()) {
            if (!vivas.has(p.clave) && p.morir === 0) {
              p.morir = ahora;
              p.ritmo.chispas.length = 0;
            }
          }

          // El nº1 vuelve a estar al mando de los choques. Se comprueba despues
          // de recorrer la tabla: el puesto tiene que estar ya actualizado en
          // todas antes de que nadie choque.
          for (const p of pelotas.values()) p.tiburon = p.puesto === 0;
        }

        // --- Ritmo de taps ---------------------------------------------------

        /**
         * Mira quien viene en racha y le suelta el empujon, las chispas y la onda.
         *
         * Va aqui, en `pintar`, y no en el bucle de dibujo, porque el dato solo
         * cambia cuando llega una actualizacion: el bucle llama 60 veces por
         * segundo a este paso y solo la primera de cada tanda ve `nuevo`.
         *
         * Tres escalones, y los tres importan:
         *
         *   * **un tap** (subida 1) acumula energia y da un micro impulso: el
         *     overlay late cuando alguien toca, aunque sea una vez;
         *   * **varios seguidos** llenan la energia, y esa energia es la que hace
         *     que el siguiente empujon sea mas fuerte;
         *   * **una racha** (TAPS_RAFAGA) da el empujon grande, suelta chispas y,
         *     si la energia esta alta, deja onda de choque.
         */
        function observarRitmo(p, valor, tasa) {
          const r = p.ritmo;
          // Cuanto subio de verdad el contador desde la ultima vez que miramos.
          const subida = Math.max(0, valor - (r.ultimo ?? valor));
          // El runtime suaviza la tasa (taps/segundo) entre vueltas justo para
          // que una rafaga de 40 taps no de un pico: el suavizado se **suma** a
          // la subida bruta en vez de sustituirla, porque la subida exacta es la
          // que decide si hay rafaga y cuanto crece el empujon.
          const empuje = Math.max(subida, Math.max(0, Number(tasa) || 0));
          r.ultimo = valor;

          // --- La energia, primero: la fuerza de abajo la usa ---
          if (subida >= 1) {
            p.energia.valor = Math.min(
              ENERGIA_MAX,
              p.energia.valor + Math.sqrt(subida) * ENERGIA_POR_TAP,
            );
          }
          const energia = p.energia.valor / ENERGIA_MAX;

          if (subida >= TAPS_RAFAGA && (r.t === false || ahora - r.t < RAFAGA_MS)) {
            // --- Rachas ---
            r.t = ahora;
            r.empujonHasta = ahora + EMPUJON_MS;
            r.pulso = ahora;
            const angulo = Math.random() * Math.PI * 2;
            // Cuanto mas fuerte la rafaga y mas cargada la energia, mas lejos sale.
            const fuerza =
              EMPUJON_VELOCIDAD * Math.min(3, 1 + empuje / 20) * (0.75 + 0.45 * energia);
            p.vx += Math.cos(angulo) * fuerza;
            p.vy += Math.sin(angulo) * fuerza;
            activarSquash(p, Math.cos(angulo), Math.sin(angulo), fuerza * 0.5);

            if (!reducido) {
              soltarChispas(p, Math.min(26, 8 + subida / 3) * (0.7 + 0.7 * energia));
            }
            if (energia >= ONDA_MINIMA) lanzarOnda(p, energia);
          } else if (subida >= 1) {
            // --- Taps sueltos: micro impulso ---
            r.pulso = ahora;
            const angulo = Math.random() * Math.PI * 2;
            const fuerza = EMPUJON_MICRO * Math.sqrt(subida) * (0.6 + 0.6 * energia);
            p.vx += Math.cos(angulo) * fuerza;
            p.vy += Math.sin(angulo) * fuerza;
            activarSquash(p, Math.cos(angulo), Math.sin(angulo), fuerza);
          }
          if (subida >= TAPS_RAFAGA) r.t = ahora;
        }

        /** La energia de taps se cae sola: sin taps, en dos segundos no queda. */
        function actualizarEnergia(p, dt) {
          p.energia.valor *= Math.exp(-dt / ENERGIA_TAU);
          if (p.energia.valor < 0.01) p.energia.valor = 0;
        }

        /** Una onda radial desde la pelota que viene en racha. */
        function lanzarOnda(p, energia) {
          if (ondas.length >= ONDAS_MAX) ondas.shift();
          ondas.push({
            clave: p.clave,
            x: p.x,
            y: p.y,
            inicio: ahora,
            fuerza: ONDA_FUERZA * (0.5 + 0.5 * energia),
          });
        }

        /**
         * Las ondas empujan a las vecinas y se apagan solas.
         *
         * Se aplica como aceleracion por fotograma y no como choque instantaneo, que
         * es lo que hace que se sienta una onda y no un golpe: la pelota que la pilla
         * al lado se va, la que esta al borde apenas se entera. La propia pelota que
         * la lanzo **no se empuja** a si misma.
         */
        function aplicarOndas(dt) {
          for (let i = ondas.length - 1; i >= 0; i--) {
            const o = ondas[i];
            const vida = (ahora - o.inicio) / ONDA_MS;
            if (vida >= 1 || vida < 0) {
              ondas.splice(i, 1);
              continue;
            }
            const radio = ONDA_RADIO * (0.35 + 0.65 * vida);
            for (const p of pelotas.values()) {
              if (p.morir > 0 || p.clave === o.clave) continue;
              const dx = p.x - o.x;
              const dy = p.y - o.y;
              const d = Math.hypot(dx, dy) || 1;
              const alcance = radio + p.radio;
              if (d > alcance) continue;
              const cercania = 1 - Math.min(1, d / alcance);
              const empuje = o.fuerza * cercania * (1 - vida) * dt;
              p.vx += (dx / d) * empuje;
              p.vy += (dy / d) * empuje;
              activarSquash(p, dx / d, dy / d, empuje * 4);
            }
          }
        }

        /** Chispas de una rafaga, con el tope que evita el borron rosa. */
        function soltarChispas(p, cuantas) {
          const sitio = CHISPAS_MAX - p.ritmo.chispas.length;
          const cuantasDeVerdad = Math.max(0, Math.min(cuantas, sitio));
          for (let i = 0; i < cuantasDeVerdad; i++) {
            const angulo = Math.random() * Math.PI * 2;
            const rapidez = 140 + Math.random() * 460;
            p.ritmo.chispas.push({
              x: p.x,
              y: p.y,
              vx: Math.cos(angulo) * rapidez,
              vy: Math.sin(angulo) * rapidez,
              vida: 1,
              tam: 7 + Math.random() * 11,
            });
          }
        }

        // --- Fisica ----------------------------------------------------------

        /**
         * Masa de una pelota para los choques.
         *
         * Va con el radio pero **por debajo del area** (r^1.6, no r^2): con el area
         * pura la mayor pesaba 17 veces la menor y la pequena salia disparada al
         * rozarla. Con 1.6 la razon es ~9, que ya se siente "esta pesa" sin que la
         * pequena salga volando. Y una pelota **en racha** pesa cuatro veces mas: es
         * lo que le da fuerza para empujar a otras mas grandes que ella.
         *
         * Ninguna queda inmovil: el impulso se reparte dividiendo por la masa, y
         * ademas el control de crucero le devuelve su velocidad. Lo que se nota es
         * que empuja poco, no que no se mueva.
         */
        function masaDe(p) {
          const base = Math.pow(Math.max(2, p.radio), 1.6);
          return ahora < p.ritmo.empujonHasta ? base * 4 : base;
        }

        /**
         * Deformacion al impactar: **solo visual**.
         *
         * Se guarda como un valor (cuanto) y un angulo (hacia donde) en vez de un
         * `squashX`/`squashY`: la deformacion es siempre a lo largo de una
         * direccion —la del golpe— y con dos ejes habria que mantenerlos
         * coherentes. El radio de **colision no cambia**: la deformacion entra solo
         * al dibujar, asi que lo que se ve y lo que choca pueden diferir un poco sin
         * que nadie note un choque raro, y sin que un `arc` reciba un radio
         * negativo, que es lo que congelo este diseno una vez.
         *
         * `fuerza` es la velocidad del golpe: se normaliza para que un roce no
         * deforme como una racha.
         */
        function activarSquash(p, nx, ny, fuerza) {
          const cuanto = Math.min(SQUASH_MAX, Math.abs(fuerza) / 900);
          if (cuanto < 0.012) return;
          if (cuanto > p.squash.valor) {
            p.squash.valor = cuanto;
            p.squash.angulo = Math.atan2(ny, nx);
          }
        }

        /** Margen para que la etiqueta no se salga: cuelga por debajo y a los lados. */
        const margenLados = (p) => Math.max(14, p.radio * 0.28);
        const margenAbajo = (p) => Math.max(44, p.radio * 0.32);

        /**
         * Cuanto puede moverse una pelota en una direccion antes de tocar la pared.
         *
         * Se usa al separar dos pelotas que se solapan: la parte del empujon que una
         * no puede recorrer la tiene que hacer la otra. Es lo que evita el caso feo
         * —una pequena atrapada entre el nº1 y el suelo— en el que el recorte de
         * pared devolvia a la pequena dentro de la grande en cada fotograma.
         */
        function holgura(p, dx, dy) {
          const lados = margenLados(p);
          const abajo = margenAbajo(p);
          let libre = Infinity;
          if (dx > 1e-6) libre = Math.min(libre, (ZONA_ANCHO - p.radio - lados - p.x) / dx);
          else if (dx < -1e-6) libre = Math.min(libre, (p.radio + lados - p.x) / dx);
          if (dy > 1e-6) libre = Math.min(libre, (ALTO - p.radio - abajo - p.y) / dy);
          else if (dy < -1e-6) libre = Math.min(libre, (ZONA_Y + p.radio - p.y) / dy);
          return Math.max(0, libre);
        }

        /**
         * Rebote en las paredes, con el **sobrante reflejado**.
         *
         * Antes la pelota se clavaba en el borde y se le daba la vuelta a la
         * velocidad: el trozo de trayectoria que ya habia recorrido de mas se
         * perdia, asi que el rebote salia corto y la pelota parecia quedarse pegada
         * al borde un instante. Medido: a 1980 px/s, un fotograma de 60 fps son 33
         * px tirados en cada choque, media pelota pequena. Ahora se calcula donde
         * toco y el sobrante se recorre hacia dentro, que es lo que hace un rebote
         * de verdad.
         *
         * La restitucion es 1: la energia la gobierna el control de crucero
         * (`ajustarVelocidad`), y tener dos mecanismos quitando energia a la vez
         * era lo que hacia temblar a las pequenas. Con el movimiento reducido la
         * pared si frena, porque ahi lo que se pide es que se queden quietas.
         */
        function rebotarEnBordes(p) {
          const restitucion = reducido ? 0 : RESTITUCION_PARED;
          const lados = margenLados(p);
          const abajo = margenAbajo(p);
          const xMin = p.radio + lados;
          const xMax = ZONA_ANCHO - p.radio - lados;
          const yMin = ZONA_Y + p.radio;
          const yMax = ALTO - p.radio - abajo;

          if (p.x < xMin) {
            p.x = xMin + (xMin - p.x) * restitucion;
            // La deformacion solo al **entrar**: una pelota que va pegada a la pared
            // no puede quedarse aplastada todo el rato.
            if (p.vx < 0) activarSquash(p, 1, 0, p.vx);
            p.vx = Math.abs(p.vx) * restitucion;
            girarPorPared(p, p.vy, 1);
          } else if (p.x > xMax) {
            p.x = xMax - (p.x - xMax) * restitucion;
            if (p.vx > 0) activarSquash(p, -1, 0, p.vx);
            p.vx = -Math.abs(p.vx) * restitucion;
            girarPorPared(p, p.vy, -1);
          }
          if (p.y < yMin) {
            p.y = yMin + (yMin - p.y) * restitucion;
            if (p.vy < 0) activarSquash(p, 0, 1, p.vy);
            p.vy = Math.abs(p.vy) * restitucion;
            girarPorPared(p, p.vx, -1);
          } else if (p.y > yMax) {
            p.y = yMax - (p.y - yMax) * restitucion;
            if (p.vy > 0) activarSquash(p, 0, -1, p.vy);
            p.vy = -Math.abs(p.vy) * restitucion;
            girarPorPared(p, p.vx, 1);
          }

          // Red de seguridad: con el sobrante reflejado y una velocidad absurda,
          // la pelota podria salir por el lado contrario en el mismo fotograma.
          if (p.x < xMin) p.x = xMin;
          if (p.x > xMax) p.x = xMax;
          if (p.y < yMin) p.y = yMin;
          if (p.y > yMax) p.y = yMax;
        }

        /**
         * Un roce con la pared anade un poco de giro.
         *
         * Es lo que hace que una pelota que baja pegada a la pared izquierda gire
         * como si rodara, en vez de deslizar. La cuenta es la de una rueda: el giro
         * que anula la velocidad del punto de contacto es `v_paralela / radio`, y
         * aqui se aplica una fraccion (`GIRO_PARED`) porque esto es un arcade y no
         * un libro de texto.
         */
        function girarPorPared(p, paralela, signo) {
          p.velocidadAngular += (paralela / Math.max(24, p.radio)) * GIRO_PARED * signo;
        }

        function chocar(a, b) {
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const distancia = Math.hypot(dx, dy);
          const suma = a.radio + b.radio;
          // Ni divisiones por cero ni trabajo cuando no se tocan: es el bucle
          // mas caliente del diseno (12 pelotas x 3 pasadas por fotograma).
          if (distancia >= suma) return;

          // Concentricas: direccion de reserva. Antes esto salia por la puerta de
          // atras (`distancia === 0`) y las dos pelotas se quedaban pegadas una
          // dentro de otra para siempre.
          let nx;
          let ny;
          if (distancia < 1e-6) {
            nx = 1;
            ny = 0;
          } else {
            nx = dx / distancia;
            ny = dy / distancia;
          }

          const masaA = masaDe(a);
          const masaB = masaDe(b);
          const total = masaA + masaB;
          const solape = suma - distancia;

          // El reparto es por masa, pero **con la pared en cuenta**: lo que una no
          // puede recorrer lo hace la otra. Sin esto, una pequena entre el nº1 y el
          // suelo se quedaba pegada (medido en el banco: 59 px de solape con 12
          // pelotas, y 35 px con solo dos).
          let moverA = solape * (masaB / total);
          let moverB = solape * (masaA / total);
          const sitioA = holgura(a, -nx, -ny);
          const sitioB = holgura(b, nx, ny);
          if (moverA > sitioA) {
            moverB += moverA - sitioA;
            moverA = sitioA;
          }
          if (moverB > sitioB) {
            moverA += moverB - sitioB;
            moverB = sitioB;
          }
          a.x -= nx * moverA;
          a.y -= ny * moverA;
          b.x += nx * moverB;
          b.y += ny * moverB;

          const acercamiento = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (acercamiento > 0) return; // ya se estaban separando

          // --- Impulso normal ---
          // Si en el choque va el nº1, la otra pelota sale **mucho** mas fuerte:
          // es el "mordisco" del tiburon, aparte de lo que ya le toca por masa.
          const conLider = a.tiburon || b.tiburon;
          const refuerzo = conLider ? EMPUJON_TIBURON : 1;
          const impulso =
            (-(1 + RESTITUCION_PAR) * acercamiento) / (1 / masaA + 1 / masaB) * refuerzo;
          a.vx -= (impulso * nx) / masaA;
          a.vy -= (impulso * ny) / masaA;
          b.vx += (impulso * nx) / masaB;
          b.vy += (impulso * ny) / masaB;

          // --- Roce: parte del golpe se va a lo tangencial ---
          //
          // Sin esto todos los choques eran de billar perfecto: dos pelotas que se
          // rozan por un lado salian como si se hubieran dado de frente. Se toma la
          // velocidad **relativa** en el eje del roce, se acota con el tope de
          // Coulomb (para que un roce no frene el sistema) y se reparte por masa,
          // igual que la normal. Es la friccion que arrastra un poco a la vecina y
          // la que gira las dos.
          const tx = -ny;
          const ty = nx;
          const roce = (b.vx - a.vx) * tx + (b.vy - a.vy) * ty;
          if (Math.abs(roce) > 1) {
            const tope = Math.abs(impulso) * FRICCION_TOPE;
            let jt = (-roce / (1 / masaA + 1 / masaB)) * FRICCION;
            jt = Math.max(-tope, Math.min(tope, jt));
            a.vx -= (jt * tx) / masaA;
            a.vy -= (jt * ty) / masaA;
            b.vx += (jt * tx) / masaB;
            b.vy += (jt * ty) / masaB;
            // El roce las gira en sentidos contrarios, como dos ruedas que se
            // tocan.
            a.velocidadAngular -= (jt / Math.max(24, a.radio)) * GIRO_CHOQUE;
            b.velocidadAngular += (jt / Math.max(24, b.radio)) * GIRO_CHOQUE;
          }

          // --- Deformacion ---
          // Solo visual, y con la fuerza del choque: un roce apenas se nota y un
          // golpe de frente si. La normal va de `a` hacia `b`, asi que cada una se
          // aplasta a lo largo de esa misma linea.
          activarSquash(a, nx, ny, acercamiento);
          activarSquash(b, -nx, -ny, acercamiento);

          // La victima del nº1 queda "empujada" un momento: sin esto, su crucero
          // frenaba el empujon en el mismo fotograma y el mordisco no se veia
          // (medido: 181 px/s, que es poco mas que su propio crucero).
          if (conLider) {
            const victima = a.tiburon ? b : a;
            if (!victima.tiburon) victima.empujadoHasta = ahora + 700;
          }
        }

        function sacudir(p, dt) {
          const r = p.ritmo;
          if (ahora > r.empujonHasta) return;
          const intensidad = (r.empujonHasta - ahora) / EMPUJON_MS;
          // La sacudida va con el tamano: una pequena tiembla poco y una grande
          // mucho. Sin esto temblaban igual y las pequenas parecian el lider.
          const peso = 0.28 + 0.72 * (p.radio / RADIO_MAX);
          // **`sqrt(dt)`, no `dt`.** Esto es un paseo aleatorio: los empujones se
          // acumulan, asi que con `dt` la varianza de la velocidad sale
          // proporcional al tamano del fotograma y a 30 fps temblaba un 41% mas que
          // a 60 (medido en el banco). Con `sqrt(dt)` la varianza por segundo es la
          // misma a cualquier ritmo, y el 310 esta puesto para que a 60 fps empuje
          // exactamente igual que antes.
          const empuje = SACUDIDA * intensidad * peso * Math.sqrt(dt);
          p.vx += (Math.random() - 0.5) * empuje;
          p.vy += (Math.random() - 0.5) * empuje;
        }

        function avanzarChispas(p, dt) {
          const chispas = p.ritmo.chispas;
          if (!chispas.length) return;
          // El frenado va por **tiempo**, no por fotograma: con `*= 0.94` a secas,
          // a los 0,5 s quedaba el 39% de la velocidad a 30 fps y el 1,2% a 144, y
          // la escena de OBS puede estar en cualquiera de las dos (medido). Asi la
          // chispa vive lo mismo en cualquier PC.
          const frenado = Math.pow(0.94, dt * 60);
          let vivas = 0;
          for (let i = 0; i < chispas.length; i++) {
            const c = chispas[i];
            c.vida -= dt * 0.9;
            c.x += c.vx * dt;
            c.y += c.vy * dt;
            c.vx *= frenado;
            c.vy *= frenado;
            if (c.vida > 0) chispas[vivas++] = c;
          }
          // Se compacta en el sitio en vez de con `filter`: esto corre en cada
          // fotograma y una lista nueva por pelota es basura para el recolector.
          chispas.length = vivas;
        }

        /**
         * Cuanto movimiento le toca a una pelota, de 0 a 1, segun su tamano.
         *
         * La mas pequena se mueve un 23% y el nº1 el 100%. Es lo que se pidio:
         * menos movimiento en el overlay, y que el que se mueva sea el que
         * importa. Con un minimo igual para todas, las pequenas correteaban como
         * el lider y la franja parecia un hervidero.
         *
         * La curva va elevada a 1,5 para que la diferencia se note pronto: doblar
         * el radio no dobla el movimiento, lo multiplica.
         */
        function pesoMovimiento(p) {
          const relativo = Math.min(1, p.radio / RADIO_MAX);
          return 0.23 + 0.77 * Math.pow(relativo, 1.5);
        }

        /**
         * Crucero y tope de velocidad de una pelota, con el empujon si lo tiene.
         *
         * Van juntos en una funcion porque los lee `ajustarVelocidad` en cada
         * fotograma y `limitarVelocidad` despues de los choques: dos copias de la
         * misma cuenta acabarian discrepando, y el tope es justo lo que faltaba
         * despues de chocar.
         */
        function limitesDe(p) {
          const peso = pesoMovimiento(p);
          // Si acaba de morderle el nº1, se le deja correr: el empujon se ve y
          // despues vuelve solo a su crucero.
          const empujada = p.empujadoHasta > ahora;
          return {
            peso,
            crucero: VELOCIDAD_MINIMA * peso * (empujada ? 4 : 1),
            maxima: VELOCIDAD_MAXIMA * Math.pow(peso, 1.8) * (empujada ? 2.2 : 1),
          };
        }

        /**
         * Devuelve la pelota a **su** velocidad de crucero, que va con su tamano.
         *
         * La primera version solo ponia un suelo: un mordisco lanzaba a una
         * pequena a 300 px/s y ahi se quedaba, porque el techo tambien era alto.
         * Medido, las pequenas acababan moviendose MAS que el lider (179 px/s
         * frente a 188) y la franja parecia un hervidero.
         *
         * Ahora cada una tiene su crucero (el 23% del minimo la mas pequena, el
         * 100% el nº1) y **vuelve a el**: un empujon se disipa en medio segundo.
         * Cuanto mas pequena, antes frena.
         */
        function ajustarVelocidad(p, dt) {
          const { peso, crucero, maxima } = limitesDe(p);
          const v = Math.hypot(p.vx, p.vy);

          if (v <= 0.01) {
            // Parada del todo: se le da una direccion nueva. Sin esto, con rebote
            // 0.92 perdian energia en cada choque y acababan clavadas (medido: 4
            // px/s de minima, o sea el diseno apagandose solo).
            const a = Math.random() * Math.PI * 2;
            p.vx = Math.cos(a) * crucero;
            p.vy = Math.sin(a) * crucero;
            return;
          }

          // Se acerca a su crucero: las pequenas frenan mas deprisa. La prisa va
          // multiplicada porque sin ella el control llegaba tarde y mandaban los
          // choques; ver `PRISA_CONTROL`.
          //
          // Va con `1 - exp(-k*dt)` y no con `min(1, k*dt)`: la forma lineal se
          // queda corta al aproximar la exponencial, y se queda mas corta cuanto
          // mas largo es el fotograma, asi que a 30 fps el control era un 20% mas
          // rapido que a 60 (medido en el banco). Con la exponencial el tiempo de
          // vuelta al crucero es el mismo en cualquier escena de OBS.
          const prisa = PRISA_CONTROL * (1.6 + 2.6 * (1 - peso));
          let objetivo = v + (crucero - v) * (1 - Math.exp(-prisa * dt));
          if (objetivo > maxima) objetivo = maxima;

          const f = objetivo / v;
          p.vx *= f;
          p.vy *= f;
        }

        /**
         * Recorta la velocidad al tope de la pelota **en el momento**, sin esperar
         * al fotograma siguiente.
         *
         * Los choques corren despues de `ajustarVelocidad`, asi que el impulso de
         * un choque vivia un fotograma entero por encima del tope y el control de
         * crucero solo lo veia al siguiente. Por si solo ya baja el jitter maximo
         * (medido en el port: 80% -> 73%); junto con `PRISA_CONTROL` es lo que deja
         * los numeros sobre el fichero de verdad. El empujon de una racha no se
         * toca: el tope tambien va con `empujadoHasta`, que es lo que le da 2,2x.
         */
        function limitarVelocidad(p) {
          const { maxima } = limitesDe(p);
          const v = Math.hypot(p.vx, p.vy);
          if (v <= maxima) return;
          const f = maxima / v;
          p.vx *= f;
          p.vy *= f;
        }

        /**
         * Devuelve a la franja las pelotas que un choque haya podido sacar.
         *
         * Solo corrige la posicion, sin tocar la velocidad, para no alterar el
         * rebote. Va **dentro** del bucle de choques: recortar puede meter una
         * pelota dentro de otra, y entonces hay que volver a separarlas.
         */
        function recortarEnZona(lista) {
          for (const p of lista) {
            if (p.morir > 0) continue;
            p.x = Math.min(
              ZONA_ANCHO - p.radio - margenLados(p),
              Math.max(p.radio + margenLados(p), p.x),
            );
            p.y = Math.min(ALTO - p.radio - margenAbajo(p), Math.max(ZONA_Y + p.radio, p.y));
          }
        }

        // --- Muelles y estado interno ----------------------------------------

        /**
         * El radio va a un **muelle**, no a un `lerp`.
         *
         * Antes el radio se acercaba a su objetivo un 3% por fotograma: crecer se
         * veia como una frenada, sin golpe. Con un muelle sube, se pasa un poco y
         * vuelve, que es el gesto que pide una racha; y funciona igual al reves,
         * cuando el contador baja y la pelota encoge.
         *
         * La amortiguacion es algo menor que la critica a proposito: un rebote corto
         * es lo que hace que se lea como elastico. Los topes evitan los dos unicos
         * casos malos: un radio negativo (el `arc` dejaria de pintar la foto) y un
         * radio enorme por un contador que se dispara.
         */
        function actualizarRadio(p, dt) {
          p.velocidadRadio +=
            (-RADIO_MUELLE * (p.radio - p.radioObjetivo) - RADIO_AMORTIGUACION * p.velocidadRadio) *
            dt;
          p.radio += p.velocidadRadio * dt;

          const minimo = RADIO_MIN * 0.55;
          const maximo = RADIO_MAX * 1.12;
          if (p.radio < minimo) {
            p.radio = minimo;
            p.velocidadRadio = Math.abs(p.velocidadRadio) * 0.2;
          } else if (p.radio > maximo) {
            p.radio = maximo;
            p.velocidadRadio = -Math.abs(p.velocidadRadio) * 0.2;
          }

          // Reposo: sin esto el muelle se queda oscilando en el ultimo decimal y la
          // pelota tiembla sin que se vea por que.
          if (Math.abs(p.radio - p.radioObjetivo) < 0.15 && Math.abs(p.velocidadRadio) < 1.5) {
            p.radio = p.radioObjetivo;
            p.velocidadRadio = 0;
          }
        }

        /**
         * Giro: un muelle que devuelve la foto a la vertical, con el angulo acotado.
         *
         * Los golpes y los roces meten velocidad angular; el muelle la devuelve a
         * cero con un balanceo corto. El angulo se queda dentro de `ANGULO_MAX`
         * (unos 10 grados) porque la cara del usuario tiene que reconocerse, y la
         * velocidad angular tiene su propio tope para que un mordisco del nº1 no de
         * un latigazo.
         *
         * El frenado va por tiempo (`exp`), no por fotograma: a 30 y a 144 fps el
         * giro se apaga igual.
         */
        function actualizarRotacion(p, dt) {
          p.velocidadAngular +=
            (-ANGULO_MUELLE * p.angulo - ANGULO_AMORTIGUACION * p.velocidadAngular) * dt;
          p.velocidadAngular = Math.max(-GIRO_MAX, Math.min(GIRO_MAX, p.velocidadAngular));

          p.angulo += p.velocidadAngular * dt;
          if (p.angulo > ANGULO_MAX) {
            p.angulo = ANGULO_MAX;
            p.velocidadAngular = Math.min(0, p.velocidadAngular);
          } else if (p.angulo < -ANGULO_MAX) {
            p.angulo = -ANGULO_MAX;
            p.velocidadAngular = Math.max(0, p.velocidadAngular);
          }

          if (Math.abs(p.angulo) < 0.002 && Math.abs(p.velocidadAngular) < 0.02) {
            p.angulo = 0;
            p.velocidadAngular = 0;
          }
        }

        /**
         * El muelle de la deformacion: vuelve a su forma y se pasa un poco.
         *
         * Es lo que hace que un golpe "se sienta": la pelota se aplasta en la
         * direccion del impacto y recupera con un rebote corto. Se apaga solo en el
         * ultimo decimal para no dejar el lienzo repintandose por una vibracion que
         * no se ve.
         */
        function actualizarSquash(p, dt) {
          const s = p.squash;
          s.velocidad += (-SQUASH_MUELLE * s.valor - SQUASH_AMORTIGUACION * s.velocidad) * dt;
          s.valor += s.velocidad * dt;

          if (s.valor > SQUASH_MAX) {
            s.valor = SQUASH_MAX;
            s.velocidad = 0;
          } else if (s.valor < SQUASH_MIN) {
            s.valor = SQUASH_MIN;
            s.velocidad = 0;
          }
          if (Math.abs(s.valor) < 0.002 && Math.abs(s.velocidad) < 0.02) {
            s.valor = 0;
            s.velocidad = 0;
          }
        }

        /**
         * El rastro, por **tiempo** y no por numero de fotogramas.
         *
         * Antes se recortaba a los nueve ultimos fotogramas, asi que la estela duraba
         * 150 ms a 60 fps y 62 ms a 144: el mismo efecto se veia distinto segun la
         * escena de OBS. Ahora se guardan las posiciones de los ultimos `RASTRO_MS`,
         * con un tope de puntos para que el coste no dependa del framerate.
         */
        function actualizarRastro(p) {
          const rastro = p.rastro;
          if (ahora < p.ritmo.empujonHasta) rastro.push({ x: p.x, y: p.y, t: ahora });
          while (rastro.length && ahora - rastro[0].t > RASTRO_MS) rastro.shift();
          if (rastro.length > RASTRO_MAX) rastro.splice(0, rastro.length - RASTRO_MAX);
        }

        /**
         * Nado del nº1: crucero constante y una atraccion suave hacia el centro.
         *
         * Un tiburon no acelera ni se para: va siempre a la misma velocidad y gira
         * despacio. La atraccion al centro evita que se quede encajado en una
         * esquina, que es lo que pasaria con un rebote puro. Mientras dura una
         * rafaga **no se aplica**, para que el empujon se note de verdad.
         */
        function nadar(p, dt) {
          if (!p.tiburon || p.ritmo.empujonHasta > ahora) return;
          const centroX = ZONA_ANCHO / 2;
          const centroY = ZONA_Y + ZONA_ALTO / 2;
          const dx = centroX - p.x;
          const dy = centroY - p.y;
          const dist = Math.hypot(dx, dy) || 1;
          p.vx += (dx / dist) * ATRAER_CENTRO * dt;
          p.vy += (dy / dist) * ATRAER_CENTRO * dt;

          // Velocidad de crucero: ni acelera ni se para.
          const v = Math.hypot(p.vx, p.vy) || 1;
          const f = VELOCIDAD_TIBURON / v;
          p.vx *= f;
          p.vy *= f;
        }

        // --- Simulacion (solo para trabajar) ---------------------------------
        //
        // No sustituye a los datos: los **inventa**. Existe porque juzgar una racha
        // mirando la previa obliga a esperar a que el publico toque justo en ese
        // momento, y los casos que hay que probar —dos pelotas, un nº1 enorme, una
        // racha extrema, un crecimiento de golpe— casi nunca salen solos.
        //
        // Habla con las MISMAS funciones que el camino de verdad (`sincronizar` y
        // `observarRitmo`), asi que lo que se ve con la simulacion encendida es la
        // fisica que va a antena, no una maqueta aparte.

        /** Generador con semilla: la simulacion tiene que repetirse igual. */
        function azarCon(semilla) {
          let a = semilla >>> 0;
          return () => {
            a = (a + 0x6d2b79f5) >>> 0;
            let t = a;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        /** Elenco de mentira: sin fotos (cae a la inicial) y sin red. */
        const ELENCO_SIM = [
          { id: "s01", unique_id: "vane_rt", nickname: "Vanessa" },
          { id: "s02", unique_id: "elcarlos", nickname: "Carlos M." },
          { id: "s03", unique_id: "lupe_99", nickname: "Lupe" },
          { id: "s04", unique_id: "drakoft", nickname: "Drako" },
          { id: "s05", unique_id: "mariamar", nickname: "Mariana" },
          { id: "s06", unique_id: "juanpa", nickname: "Juan Pablo" },
          { id: "s07", unique_id: "sofi_g", nickname: "Sofi" },
          { id: "s08", unique_id: "richi", nickname: "Ricardo" },
          { id: "s09", unique_id: "nando_x", nickname: "Fernando" },
          { id: "s10", unique_id: "camilo_r", nickname: "Camilo" },
          { id: "s11", unique_id: "paolita", nickname: "Paola" },
          { id: "s12", unique_id: "andresit", nickname: "Andres" },
        ];

        /**
         * Los escenarios, en el orden en que se recorren.
         *
         * Cada uno dura unos segundos y toca los taps a su manera. Lo que hay que
         * comprobar no es solo que aguante la racha, sino que **vuelva** al estado
         * tranquilo despues: por eso el ciclo empieza y acaba en `tranquilo`, y por
         * eso la reduccion de tamano esta despues del crecimiento.
         *
         *   `toque`        taps por segundo y por persona (fondo)
         *   `rafagaCada`   cada cuanto suelta una rafaga, en ms
         *   `rafagaTaps`   taps de esa rafaga
         *   `rafagaTop1`   la rafaga va siempre al nº1 (y deja onda de choque)
         *   `alEntrar`     lo que se hace una sola vez al empezar el escenario
         */
        const ESCENARIOS = [
          { id: "tranquilo", ms: 5000, toque: 0 },
          { id: "taps_sueltos", ms: 6000, toque: 0.35 },
          { id: "rafaga_uno", ms: 6000, toque: 0.5, rafagaCada: 1800, rafagaTaps: 9 },
          { id: "rafaga_top1", ms: 6000, toque: 0.4, rafagaCada: 1500, rafagaTaps: 30, rafagaTop1: true },
          // Sin taps de fondo y con las rafagas marcadas por el **reloj**: asi la
          // entrada no depende de cuantos fotogramas se hayan dibujado, y sirve para
          // comparar 30 con 144 fps sin que el azar de cada fotograma los separe.
          { id: "solo_rafagas", ms: 8000, toque: 0, rafagaCada: 1500, rafagaTaps: 26, rafagaTop1: true },
          { id: "varios", ms: 7000, toque: 1.6 },
          { id: "crecimiento", ms: 4000, toque: 1, alEntrar: "crecer" },
          { id: "reduccion", ms: 4000, toque: 0, alEntrar: "encoger" },
          // Crecer y encoger de golpe, una y otra vez: es el unico escenario que
          // estresa el muelle del radio en los dos sentidos sin parar, y el que deja
          // ver si se queda oscilando.
          { id: "vaiven", ms: 14000, toque: 0.4, vaiven: true },
          { id: "top1_grande", ms: 6000, toque: 0.3, alEntrar: "top1" },
          // Valores casi iguales (todas del mismo tamano) y una escalera que se
          // parte por la mitad en cada puesto: los dos extremos del reparto, que es
          // donde se ve si el minimo legible y el tope de arriba hacen su trabajo.
          { id: "parejos", ms: 7000, toque: 0.5, alEntrar: "parejos" },
          { id: "escalera", ms: 8000, toque: 0.3, alEntrar: "escalera" },
          // Los puntos de referencia del encargo, uno por pelota, con el par 5.000 /
          // 5.001 para poder comprobar que **un solo tap** cambia la escala. Sin taps de
          // fondo: si los hubiera, las cifras se moverian y la tabla no se podria leer.
          { id: "progresion", ms: 12000, toque: 0, alEntrar: "progresion" },
          { id: "tranquilo", ms: 6000, toque: 0 },
        ];

        /** Cada cuanto se manda la tabla inventada: el directo publica a 1/s. */
        const VENTANA_SIM_MS = 250;

        const sim = {
          escenario: 0,
          desde: 0,
          valores: new Map(),
          taps: new Map(),
          gente: new Map(ELENCO_SIM.map((p) => [p.id, p])),
          activos: ELENCO_SIM.slice(0, SIM_PELOTAS).map((p) => p.id),
          azar: azarCon(SIM_SEMILLA),
          ventana: 0,
          ultimaRafaga: 0,
          ultimoVaiven: 0,
          vaivenArriba: true,
          nombre: "",
          /** Parrafo del lienzo donde se enseña el escenario; se toma en `montar`. */
          rotulo: null,
        };

        function escenarioSim() {
          if (SIM_ESCENARIO) {
            return ESCENARIOS.find((e) => e.id === SIM_ESCENARIO) ?? ESCENARIOS[0];
          }
          return ESCENARIOS[sim.escenario % ESCENARIOS.length];
        }

        const valorSim = (id) => sim.valores.get(id) || 0;

        function sumarTaps(id, cuantos) {
          sim.valores.set(id, valorSim(id) + cuantos);
          sim.taps.set(id, (sim.taps.get(id) || 0) + cuantos);
        }

        function liderSim() {
          let mejor = sim.activos[0];
          for (const id of sim.activos) if (valorSim(id) > valorSim(mejor)) mejor = id;
          return mejor;
        }

        /**
         * Reparte factores **distintos** por persona.
         *
         * Multiplicar a todos por el mismo numero no cambia **ningun** radio: los
         * tamanos salen de `sqrt(valor / maximo)`, asi que un factor comun se
         * cancela. El primer `vaiven` que escribi hacia justo eso y el muelle del
         * radio no se movia ni un pixel, que es justo lo que hay que probar.
         */
        function escalarValores(minimo, maximo) {
          for (const id of sim.activos) {
            const factor = minimo + sim.azar() * (maximo - minimo);
            sim.valores.set(id, Math.max(60, Math.round(valorSim(id) * factor)));
          }
        }

        /** Lo que se hace una sola vez al entrar en un escenario. */
        function entrarEnEscenario(e) {
          if (e.alEntrar === "crecer") {
            escalarValores(0.7, 3.2);
          } else if (e.alEntrar === "encoger") {
            escalarValores(0.15, 1.1);
          } else if (e.alEntrar === "top1") {
            const jefe = liderSim();
            for (const id of sim.activos) {
              sim.valores.set(id, id === jefe ? Math.round(valorSim(id) * 12) + 400 : Math.round(valorSim(id) * 0.2));
            }
          } else if (e.alEntrar === "parejos") {
            // Todos rozando el tope de taps: es el caso en el que el tope de area tiene
            // que entrar, porque diez pelotas al maximo no caben en la franja.
            for (const id of sim.activos) {
              sim.valores.set(id, Math.round(TAPS_TOPE * (0.92 + sim.azar() * 0.08)));
            }
          } else if (e.alEntrar === "escalera") {
            // Cada puesto con la mitad de taps que el anterior, desde el tope hacia
            // abajo: se ve la curva entera (15.000, 7.500, 3.750…) de un vistazo.
            const alto = Math.max(...sim.activos.map(valorSim), TAPS_TOPE);
            sim.activos.forEach((id, i) => {
              sim.valores.set(id, Math.max(20, Math.round(alto / Math.pow(2, i))));
            });
          } else if (e.alEntrar === "progresion") {
            // Los valores de referencia del encargo —0, 350, 1.000, 3.000, 5.000,
            // 7.500, 10.000, 12.500 y 15.000— mas el 5.001, que tiene que dar un tamano
            // distinto del 5.000 aunque sea por milesimas.
            const referencia = [15000, 12500, 10000, 7500, 5001, 5000, 3000, 1000, 350, 0];
            sim.activos.forEach((id, i) => {
              sim.valores.set(id, referencia[i] ?? 0);
            });
          }
          sim.ultimaRafaga = 0;
          sim.ultimoVaiven = 0;
          sim.vaivenArriba = true;
          if (sim.rotulo && SIMULAR_FISICA) sim.rotulo.textContent = `${e.id} · ${SIM_PELOTAS} pelotas`;
        }

        function arrancarSimulacion() {
          // Los valores de partida van por la mitad del recorrido —entre 2.000 y 9.000
          // taps, que son radios de 36 a 70— y no cerca de cero: con la curva absoluta,
          // empezar en cientos de taps dejaria las diez pelotas en el minimo y no se
          // podria juzgar ni el crecimiento ni los choques de una pelota grande.
          for (const id of sim.activos) {
            sim.valores.set(id, Math.round(2000 + sim.azar() * 7000));
          }
          entrarEnEscenario(escenarioSim());
        }

        /** Manda la tabla inventada por el mismo camino que el directo. */
        function enviarTablaSim() {
          const gente = sim.activos
            .map((id) => ({ id, persona: sim.gente.get(id), valor: valorSim(id) }))
            .sort((a, b) => b.valor - a.valor);
          const entradas = gente.map((g) => ({
            // Sin `avatar_url`: el diseno cae a la inicial, que es justo lo que
            // hace con quien no tiene foto. Ni una peticion de red.
            user: { id: g.id, unique_id: g.persona.unique_id, nickname: g.persona.nickname, avatar_url: null },
            value: g.valor,
            events: Math.max(1, Math.round(g.valor / 6)),
          }));

          sincronizar(entradas);

          const segundos = VENTANA_SIM_MS / 1000;
          for (const [clave, p] of pelotas) {
            if (p.morir > 0) continue;
            observarRitmo(p, p.valor, (sim.taps.get(clave) || 0) / segundos);
          }
          sim.taps.clear();
        }

        /** Un fotograma de simulacion: toca taps, cambia de escenario y publica. */
        function avanzarSimulacion(dt) {
          const e = escenarioSim();
          sim.desde += dt * 1000;

          // 1. Cambio de escenario: al acabarse el tiempo, el siguiente.
          if (!SIM_ESCENARIO && sim.desde >= e.ms) {
            sim.escenario = (sim.escenario + 1) % ESCENARIOS.length;
            sim.desde = 0;
            entrarEnEscenario(escenarioSim());
          }

          // 2. Taps de fondo. La probabilidad va con `dt`, asi que el ritmo es el
          //    mismo a 30 que a 144 fps.
          const toque = e.toque ?? 0;
          if (toque > 0) {
            for (const id of sim.activos) {
              if (sim.azar() < toque * dt) sumarTaps(id, 1 + (sim.azar() < 0.25 ? 1 : 0));
            }
          }

          // 3. Rafagas: a uno al azar, o al nº1 (que es la que deja onda).
          if (e.rafagaCada && sim.desde - sim.ultimaRafaga >= e.rafagaCada) {
            sim.ultimaRafaga = sim.desde;
            const objetivo = e.rafagaTop1
              ? liderSim()
              : sim.activos[Math.floor(sim.azar() * sim.activos.length)];
            sumarTaps(objetivo, e.rafagaTaps ?? 9);
          }

          // 4. Vaiven: crecer y encoger de golpe, para el muelle del radio.
          if (e.vaiven && sim.desde - sim.ultimoVaiven >= 1600) {
            sim.ultimoVaiven = sim.desde;
            if (sim.vaivenArriba) escalarValores(0.7, 3.2);
            else escalarValores(0.15, 1.1);
            sim.vaivenArriba = !sim.vaivenArriba;
          }

          // 4. La tabla, al mismo camino que el directo.
          sim.ventana += dt * 1000;
          if (sim.ventana >= VENTANA_SIM_MS) {
            sim.ventana = 0;
            enviarTablaSim();
          }
        }

        // --- Metricas y sonda ------------------------------------------------
        //
        // Se miden **siempre**: son cuatro sumas por fotograma, y sin ellas no hay
        // forma de saber desde fuera si el diseno va a 60 fps o a 22. La sonda las
        // lee por el depurador con `window.__pelotasDebug()`.

        const metricas = {
          fotogramas: 0,
          msAcumulado: 0,
          msPeor: 0,
          ventanaMs: 0,
          ventanaFotogramas: 0,
          fps: 0,
          msMedio: 0,
        };

        function anotarFotograma(ms) {
          metricas.fotogramas += 1;
          metricas.msAcumulado += ms;
          metricas.msPeor = Math.max(metricas.msPeor, ms);
          metricas.ventanaMs += ms;
          metricas.ventanaFotogramas += 1;
          if (metricas.ventanaMs >= 1000) {
            metricas.fps = (metricas.ventanaFotogramas * 1000) / metricas.ventanaMs;
            metricas.msMedio = metricas.ventanaMs / metricas.ventanaFotogramas;
            metricas.msPeor = 0;
            metricas.ventanaMs = 0;
            metricas.ventanaFotogramas = 0;
          }
        }

        const media = (lista) => (lista.length ? lista.reduce((a, v) => a + v, 0) / lista.length : 0);

        /** Solape maximo entre dos pelotas: lo que se ve como "pegadas". */
        function solapeMaximo(lista) {
          let peor = 0;
          for (let i = 0; i < lista.length; i++) {
            for (let j = i + 1; j < lista.length; j++) {
              const d = Math.hypot(lista[j].x - lista[i].x, lista[j].y - lista[i].y);
              peor = Math.max(peor, lista[i].radio + lista[j].radio - d);
            }
          }
          return peor;
        }

        /**
         * La foto de la fisica, para leerla desde el depurador del navegador.
         *
         * Devuelve tambien `problemas`: la lista de cosas que **no** deberian pasar
         * (fuera de la franja, por encima del tope de velocidad, coordenadas no
         * finitas, solapes, fps bajos). Es lo que se mira despues de cada cambio en
         * vez de confiar en que "se ve bien".
         */
        window.__pelotasDebug = () => {
          const lista = [...pelotas.values()].filter((p) => p.morir === 0);
          const velocidades = lista.map((p) => Math.hypot(p.vx, p.vy));
          const limites = lista.map((p) => limitesDe(p));
          const problemas = [];

          lista.forEach((p, i) => {
            if (!Number.isFinite(p.x) || !Number.isFinite(p.y) || !Number.isFinite(p.vx)) {
              problemas.push(`pelota ${p.clave}: coordenada no finita`);
            }
            if (velocidades[i] > limites[i].maxima + 1) {
              problemas.push(`pelota ${p.clave}: ${velocidades[i].toFixed(0)} px/s sobre su tope ${limites[i].maxima.toFixed(0)}`);
            }
            const lados = margenLados(p);
            if (p.x - p.radio < lados - 1 || p.x + p.radio > ZONA_ANCHO - lados + 1) {
              problemas.push(`pelota ${p.clave}: fuera por los lados (x=${p.x.toFixed(0)})`);
            }
            if (p.y - p.radio < ZONA_Y - 1 || p.y + p.radio > ALTO - margenAbajo(p) + 1) {
              problemas.push(`pelota ${p.clave}: fuera por arriba o abajo (y=${p.y.toFixed(0)})`);
            }
          });
          const solape = solapeMaximo(lista);
          if (solape > 2) problemas.push(`solape de ${solape.toFixed(1)} px entre dos pelotas`);
          // Por debajo de 24 fps si que hay un problema: a 30 fps (una escena de OBS
          // mas lenta) el diseno tiene que ir fino, no solo "no caerse".
          if (metricas.fps > 0 && metricas.fps < 24) problemas.push(`caida de fps: ${metricas.fps.toFixed(1)}`);

          return {
            modo: SIMULAR_FISICA ? "simulacion" : "directo",
            depuracion: DEBUG_FISICA,
            escenario: SIMULAR_FISICA ? escenarioSim().id : null,
            pelotas: lista.length,
            fps: Number(metricas.fps.toFixed(1)),
            msMedio: Number(metricas.msMedio.toFixed(2)),
            fotogramas: metricas.fotogramas,
            vMedia: Number(media(velocidades).toFixed(0)),
            vMax: Number(Math.max(0, ...velocidades).toFixed(0)),
            relMedia: Number(media(velocidades.map((v, i) => v / limites[i].crucero)).toFixed(2)),
            masaMin: Number(Math.min(...lista.map((p) => masaDe(p, ahora))).toFixed(0)),
            masaMax: Number(Math.max(...lista.map((p) => masaDe(p, ahora))).toFixed(0)),
            radioMin: Number(Math.min(...lista.map((p) => p.radio)).toFixed(1)),
