<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Fichas · Overlay</title>
    <link rel="stylesheet" href="comun.css" />
    <!-- Fichas: el nº1 ocupa la ficha ancha de arriba —foto grande, cifra grande y
         su nombre en blanco— y los siguientes van de dos en dos en fichas
         pequenas. Es la jerarquia por tamano lo que se lee: no hay barras, asi
         que la distancia entre el primero y el resto la marca el cuerpo de la
         cifra, no una medida. -->
    <style>
      .rejilla {
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr 1fr;
      }

      .ficha {
        align-items: center;
        background: rgba(29, 34, 44, 0.75);
        border: 1px solid #2c3444;
        border-radius: 10px;
        display: grid;
        gap: 9px;
        grid-template-columns: 38px minmax(0, 1fr);
        padding: 8px 10px;
        /* El relevo de puesto se ve aunque no haya barra que crezca: la ficha que
           sube cambia de color y de borde, y ese cambio se anima. */
        transition:
          border-color 400ms ease-out,
          background-color 400ms ease-out;
      }

      .ficha .nombre {
        color: var(--texto);
        display: block;
        font-size: 12px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ficha .cifra {
        color: var(--acento);
        font-size: 22px;
        font-variant-numeric: tabular-nums;
        font-weight: 800;
        line-height: 1.05;
      }

      .ficha .unidad {
        color: var(--apagado);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      /* --- La ficha del nº1 ------------------------------------------------- */

      /* La banda roja es lo que hace que el primer puesto se lea desde lejos, y
         ocupa las dos columnas para que el ojo no tenga que buscar su pareja. */
      /* La ficha del nº1 da a su foto una columna mas ancha. La maqueta dejaba la
         columna en 38 px para todas y la foto grande se salia por encima del
         texto: aqui el carril se ensancha con el retrato. */
      .ficha.uno {
        background: linear-gradient(120deg, rgba(255, 46, 99, 0.2), rgba(255, 46, 99, 0.03));
        border-color: rgba(255, 46, 99, 0.45);
        grid-column: span 2;
        grid-template-columns: 46px minmax(0, 1fr);
      }

      /* Solo el retrato lleva aro, no su caja: la caja es la referencia sobre la
         que se apoya la corona del nº1. */
      .ficha.uno .retrato {
        border: 3px solid var(--lider);
        box-shadow: 0 0 14px rgba(255, 46, 99, 0.45);
      }

      .ficha.uno .nombre {
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
      }

      .ficha.uno .cifra {
        color: var(--lider);
        font-size: 34px;
      }
    </style>
  </head>
  <body>
    <div class="vista" id="raiz">
      <section class="tarjeta">
        <div class="cab">
          <h1 id="titulo"></h1>
          <span class="total" id="total">0</span>
        </div>
        <div class="rejilla" id="filas"></div>
      </section>
      <p class="aviso" id="aviso">Conectando…</p>
    </div>

    <script src="anim.js"></script>
    <script>
      /* Solo **define** el diseno. Arrancar es cosa de `comun.js`, que se carga
         despues: asi el orden (montar, y luego los datos) es el mismo en los once
         disenos y no depende de como este escrito cada uno. */
      window.diseno = (() => {
        /* Cuantas fichas caben. La primera es ancha y las demas van de dos en dos,
           asi que un numero non de fichas dejaria un hueco abajo: nueve lo llena
           justo. El tope de `entradas` es diez, de modo que aqui siempre recorta
           algo cuando la tabla viene llena. */
        const CUANTAS = 9;

        let contenedor = null;
        let total = null;
        let liderPrevio = null;

        /**
         * Retrato con su inicial de reserva cuando TikTok no manda foto.
         *
         * La caja `.retrato-caja` no es decorativa: es donde `anim.colocarCorona`
         * busca el sitio para la corona. Sin ella el nº1 se quedaria sin corona
         * sin que fallara nada, que es justo el tipo de averia que no se ve en
         * consola.
         */
        function retrato(entrada, tam) {
          const caja = document.createElement("span");
          caja.className = "retrato-caja";
          if (entrada.user?.avatar_url) {
            const img = document.createElement("img");
            img.className = "retrato";
            img.src = entrada.user.avatar_url;
            img.alt = "";
            img.loading = "lazy";
            img.decoding = "async";
            img.referrerPolicy = "no-referrer";
            img.style.height = tam + "px";
            img.style.width = tam + "px";
            caja.appendChild(img);
          } else {
            const inicial = document.createElement("span");
            inicial.className = "retrato inicial";
            inicial.style.height = tam + "px";
            inicial.style.width = tam + "px";
            inicial.style.fontSize = Math.round(tam * 0.4) + "px";
            inicial.textContent = (entrada.user?.nickname || entrada.user?.unique_id || "?")
              .slice(0, 1)
              .toUpperCase();
            caja.appendChild(inicial);
          }
          return caja;
        }

        function porClave(clave) {
          return [...contenedor.children].find((hijo) => hijo.dataset.clave === clave);
        }

        /**
         * Reordena el DOM segun el orden nuevo, sin tocar la identidad de cada
         * ficha: la misma clave sigue siendo el mismo `<div>`, que es lo que
         * permite que la animacion tenga un destino coherente.
         */
        function reordenar(entradas, crear, colocar) {
          const antes = anim.recogerPosiciones(contenedor);
          const vivas = new Set(entradas.map((entrada) => String(entrada.user?.id)));
          anim.retirarAusentes(contenedor, vivas);

          entradas.forEach((entrada, indice) => {
            const nuevo = crear(entrada, indice);
            const actual = porClave(nuevo.dataset.clave);
            if (actual) actual.replaceWith(nuevo);
            else contenedor.appendChild(nuevo);
          });
          entradas.forEach((entrada, indice) => {
            const hijo = porClave(String(entrada.user?.id));
            if (hijo && contenedor.children[indice] !== hijo) {
              contenedor.insertBefore(hijo, contenedor.children[indice] ?? null);
            }
          });

          anim.animarCambioDePuesto(contenedor, antes);
          colocar();
        }

        /** Clase de cada ficha, en orden de puesto. */
        const puesto = (indice) => (indice === 0 ? "ficha uno" : "ficha");

        return {
          montar(raiz, ctx) {
            contenedor = raiz.querySelector("#filas");
            total = raiz.querySelector("#total");
            raiz.querySelector("#titulo").textContent = ctx.titulo;
          },

          pintar(entradas, _tasas, ctx) {
            total.textContent = ctx.numero(ctx.total(entradas));
            const fichas = entradas.slice(0, CUANTAS);
            const nuevoLider = fichas[0] ? String(fichas[0].user?.id) : null;

            reordenar(
              fichas,
              (entrada, indice) => {
                const ficha = document.createElement("div");
                ficha.className = puesto(indice);
                ficha.dataset.clave = String(entrada.user?.id);

                const cuerpo = document.createElement("span");
                const nombre = document.createElement("span");
                nombre.className = "nombre";
                const completo = ctx.nombre(entrada);
                nombre.textContent = completo;
                nombre.title = completo;

                const cifra = document.createElement("div");
                cifra.className = "cifra";
                cifra.textContent = ctx.numero(entrada.value);
                const unidad = document.createElement("span");
                unidad.className = "unidad";
                /* Que mide la cifra depende de la vista —taps, diamantes o
                   seguidores—, asi que la etiqueta sale del rotulo de la vista y
                   no de un texto fijo en el fichero. */
                unidad.textContent = " " + ctx.titulo.toLowerCase();
                cifra.appendChild(unidad);

                cuerpo.append(nombre, cifra);
                ficha.append(retrato(entrada, indice === 0 ? 46 : 38), cuerpo);
                return ficha;
              },
              () => {
                // La corona se coloca despues de reordenar, sobre el DOM final: si
                // se hiciera antes, la ficha del nº1 seria otra.
                const fichaUno = nuevoLider ? porClave(nuevoLider) : null;
                anim.limpiarCoronas(contenedor, fichaUno);
                if (fichaUno) anim.colocarCorona(fichaUno, { esNueva: nuevoLider !== liderPrevio });
                liderPrevio = nuevoLider;
              },
            );
          },
        };
      })();
    </script>
    <script src="comun.js"></script>
  </body>
</html>
