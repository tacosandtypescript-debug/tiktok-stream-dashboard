<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Alertas · Overlay</title>
    <link rel="stylesheet" href="comun.css" />
    <!-- El contenedor del mensaje tiene su propia hoja: su estilo, sus decoraciones y
         las animaciones de sus letras son un sistema aparte del de la alerta entera, y
         mezclarlos aqui haria que tocar un preset pudiera romper la entrada del aviso. -->
    <link rel="stylesheet" href="mensaje/estilos.css" />
    <!-- Alertas: el aviso que sale en pantalla cuando alguien regala, sigue,
         comparte, se suscribe o suelta una rafaga de likes.

         No es uno de los disenos de ranking y por eso no pasa por el mismo
         contrato: un diseno de ranking pinta una tabla que cambia, y esto pinta un
         aviso detras de otro que aparece y desaparece. -->
    <style>
      /* Todo el escenario ocupa la fuente entera de OBS y esta vacio: el aviso se
         coloca en el centro y el resto del cuadro queda transparente para que se
         vea el video del streamer. */
      .escenario {
        align-items: center;
        display: flex;
        height: 100vh;
        justify-content: center;
        width: 100vw;
      }

      .aviso-caja {
        align-items: center;
        display: flex;
        flex-direction: column;
        /* El hueco entre el medio y su mensaje. Es del **mensaje**, y por eso lo escribe
           su renderer cuando el streamer mueve la separacion; este 14 px es el valor de
           fabrica y el que se ve si el renderer no llega a escribir nada.
           Sin texto, el contenedor se esconde y un `gap` con un solo hijo no separa
           nada: no hace falta cerrarlo a mano. */
        gap: var(--mensaje-separacion, 14px);
        max-width: 80vw;
        /* El tamaño que le ha dado el streamer a este aviso, aplicado de una vez a
           todo lo que hay dentro: el medio **y** su texto.

           Se hace con `zoom` y no con `max-height`/`max-width` por un motivo que se
           vio midiendo: los `max-*` solo **recortan**, asi que en el caso mas comun
           —un sticker de 150 px— el mando no hacia absolutamente nada, porque el
           medio nunca llegaba al tope. `zoom` multiplica el tamaño real, y a 1 no
           cambia nada: los avisos que ya estaban configurados salen igual que antes. */
        zoom: var(--escala, 1);

        /* --- La animacion la pone el motor, no esta hoja ---------------------

           Aqui no hay ninguna animacion escrita: hay **el sitio donde empieza** el
           aviso y cuanto tarda en llegar a su sitio. El motor de `alertas.js` escribe
           esas tres variables con la animacion que el streamer haya elegido para este
           aviso, y la transicion la lleva el navegador.

           Se hace asi, y no con clases por animacion, porque son once animaciones por
           dos sentidos: con clases habria veintidos combinaciones que mantener, y
           añadir una nueva obligaria a tocar el CSS y el JS. Con variables, una
           animacion nueva es **una linea** en el catalogo del motor.

           `--ritmo` sale del catalogo de ritmos, y `auto` deja que lo ponga la propia
           animacion: un rebote trae su rebote sin que nadie lo elija. */
        opacity: var(--entra-opacidad, 1);
        transform: var(--entra-transformacion, none);
        filter: var(--entra-desenfoque, none);
        /* `translate`, `scale` y `rotate` entran en la lista por la permanencia: son
           las que mueven el aviso mientras esta en pantalla, y al pararla tienen que
           **volver a su sitio** con la duracion de la salida, no de un golpe. */
        transition:
          opacity var(--ms-animacion, 300ms) var(--ritmo-animacion, ease-out),
          transform var(--ms-animacion, 300ms) var(--ritmo-animacion, ease-out),
          translate var(--ms-animacion, 300ms) var(--ritmo-animacion, ease-out),
          scale var(--ms-animacion, 300ms) var(--ritmo-animacion, ease-out),
          rotate var(--ms-animacion, 300ms) var(--ritmo-animacion, ease-out),
          filter var(--ms-animacion, 300ms) var(--ritmo-animacion, ease-out);
        /* Las dos capas de la permanencia —la franja del brillo y el anillo del
           borde— se colocan sobre la caja, asi que la caja tiene que ser su
           referencia. No llevan fondo ni borde propios: los pone el efecto que este
           puesto, y si no hay ninguno quedan invisibles. */
        position: relative;
      }

      /* La franja de luz del brillo. */
      .aviso-caja::before {
        border-radius: var(--radio-tarjeta, 12px);
        content: "";
        inset: 0;
        pointer-events: none;
        position: absolute;
        z-index: 1;
      }

      /* El anillo del borde. Va con `mask` para que sea **solo el contorno** y no un
         rectangulo relleno: es el mismo truco que un borde degradado. */
      .aviso-caja::after {
        border-radius: var(--radio-tarjeta, 12px);
        content: "";
        inset: -6px;
        padding: 3px;
        pointer-events: none;
        position: absolute;
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        mask-composite: exclude;
      }

      /* El estado final: el aviso en su sitio, sin transformacion ni desenfoque. */
      .aviso-caja.visible {
        opacity: 1;
        filter: none;
        transform: none;
      }

      /* El medio nunca desborda al streamer: se le pone un tope de alto y ancho y
         se respeta la proporcion. Un GIF de 800x2000 sin esto taparia el directo
         entero.

      /* El medio **nunca desborda** al streamer, y ademas todos los medios parten del
         mismo tamaño.

         Antes mandaba el tamaño natural del fichero: un sticker de 150 px salia
         diminuto y un GIF de 1000 px enorme, y no habia forma de igualarlos salvo
         moviendo el mando uno a uno. Ahora el punto de partida es **el mismo para
         todos** —un 38 % del alto del lienzo— y lo que cambia es la proporcion de cada
         fichero, que se respeta porque la altura la pone la regla y la anchura la saca
         el navegador de la relacion de aspecto (`width: auto`).

         Todo se mide **en `vh`**, y no es un detalle: asi el tamaño es el mismo en
         cualquier lienzo de la misma altura. Mezclando `vw`, el mismo aviso saldria
         distinto en la previa cuadrada que en una fuente de OBS de 1920x1080, y la
         previa dejaria de decir la verdad. Los `min()` y `max()` de la derecha solo
         entran en lienzos muy estrechos, como red.

         Los topes van **divididos por la escala** porque `zoom` los multiplica
         despues: asi siguen midiendo lo mismo **en pantalla** suba lo que suba el
         mando, y un aviso al 200 % no se sale del cuadro. */
      .aviso-medio {
        display: none;
        height: min(38vh, 62vw);
        width: auto;
        max-height: min(calc(70vh / var(--escala, 1)), 100vh);
        max-width: min(calc(90vh / var(--escala, 1)), 92vw);
        /* Red de seguridad: si algo forzara las dos dimensiones a la vez, `contain`
           impide que la imagen se estire. La proporcion no se toca nunca. */
        object-fit: contain;
      }

      .aviso-medio.puesto {
        display: block;
      }

      .aviso {
        bottom: 8px;
        position: fixed;
        right: 12px;
      }

      /* Con `prefers-reduced-motion` —y en OBS se puede dar— el aviso entra y sale
         con un fundido corto y sin moverse. Se respeta la preferencia del sistema,
         pero **no** se quita la animacion entera: un aviso que aparece de golpe es
         justo lo que se venia a evitar, y aqui solo molesta el movimiento. */
      @media (prefers-reduced-motion: reduce) {
        .aviso-caja {
          transform: none;
          filter: none;
          transition: opacity 220ms linear;
        }
      }
    </style>
  </head>
  <body>
    <div class="escenario">
      <div class="aviso-caja" id="caja">
        <img class="aviso-medio" id="imagen" alt="" />
        <video class="aviso-medio" id="video" playsinline></video>
        <!-- El contenedor del mensaje. Dentro van la capa del brillo —la franja de luz
             que lo cruza, recortada a su forma— y el texto, que es lo unico que se
             escribe desde `alertas.js`. -->
        <div class="aviso-mensaje" id="mensaje" hidden>
          <span class="aviso-mensaje-capa" aria-hidden="true">
            <span class="aviso-mensaje-brillo" id="mensaje-brillo"></span>
          </span>
          <span class="aviso-mensaje-texto" id="texto"></span>
        </div>
      </div>
    </div>
    <audio id="sonido"></audio>
    <p class="aviso" id="aviso">Conectando…</p>
    <!-- El mensaje, en cinco piezas: la configuracion, los estilos, las animaciones del
         contenedor, las del texto y el pintor. Van antes que `alertas.js` porque es el
         quien las usa, y separadas porque son cinco cosas distintas: añadir un preset o
         una animacion no toca las otras cuatro. -->
    <script src="mensaje/config.js"></script>
    <script src="mensaje/presets.js"></script>
    <script src="mensaje/animaciones.js"></script>
    <script src="mensaje/texto.js"></script>
    <script src="mensaje/renderer.js"></script>
    <script src="alertas.js"></script>
  </body>
</html>
